<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8">
<title>工作台 · 拟真拼贴原型</title>
<style>
*{box-sizing:border-box;margin:0}
body{background:#0a0f1e;color:#e8ecf5;font-family:"Segoe UI",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;padding:38px 48px 90px}
button{font-family:inherit}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1400px;margin:0 auto}
.head{display:flex;align-items:flex-start;gap:16px;margin-bottom:26px}
.head h1{font-size:24px;font-weight:650;letter-spacing:-.02em}
.head p{margin-top:6px;font-size:13px;color:#8b94a8}
.pill{margin-left:auto;display:flex;align-items:center;gap:8px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.045);color:#b7c0d4;border-radius:8px;padding:8px 16px;font-size:13px;cursor:pointer}
.pill b{color:#7aa7ff;font-weight:400}
.sec{margin-bottom:30px}
.sec-t{margin:0 0 12px;font-family:ui-monospace,Consolas,monospace;font-size:12px;font-weight:500;color:#8b94a8;letter-spacing:2px}
.sec-t::before{content:'// ';color:#7aa7ff}
.doors{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.tile{position:relative;border:1px solid rgba(255,255,255,.1);border-radius:16px;
background:rgba(255,255,255,.045);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
box-shadow:inset 0 1px 0 0 rgba(255,255,255,.07);
overflow:hidden;cursor:pointer;text-align:left;padding:0;min-width:0;
transition:background .15s,border-color .15s}
.tile:hover{background:rgba(255,255,255,.07);border-color:rgba(122,167,255,.4)}
.tile:hover .d-ic{color:#7aa7ff}
.door{min-height:158px;padding:20px 22px}
.door-head{display:flex;align-items:center;gap:10px}
.door-head strong{font-size:16px;font-weight:650}
.d-desc{display:block;margin-top:7px;font-style:normal;font-size:12.5px;color:#8b94a8;max-width:44%}
.d-num{position:absolute;top:16px;right:20px;font-size:32px;font-weight:300;line-height:1;color:#b7c0d4;transition:color .15s}
.door:hover .d-num{color:#7aa7ff}
.d-ic{display:flex;color:#8b94a8;transition:color .15s}
.d-ic svg{width:20px;height:20px}
/* 图形区：渐变光晕 + 淡点阵，mock 元素浮在上方 */
.door-art{position:absolute;right:12px;bottom:10px;width:56%;height:80%;pointer-events:none;
background:radial-gradient(90% 90% at 70% 30%,rgba(59,130,246,.1),transparent 65%)}
.mods .tile{display:flex;flex-direction:column;min-height:252px;padding:0}
.mod-art{position:relative;height:138px;flex:none;border-bottom:1px solid rgba(255,255,255,.06);
background:radial-gradient(100% 100% at 50% 0%,rgba(59,130,246,.1),transparent 68%),
radial-gradient(rgba(255,255,255,.05) 1px,transparent 1.5px);background-size:auto,13px 13px}
.mod-body{padding:14px 18px 18px}
.mod-body strong{font-size:15px;font-weight:650}
.mod-body i{display:block;margin-top:5px;font-style:normal;font-size:12.5px;color:#8b94a8}
/* ═══ 拟真 mock 元素（拼贴积木）═══ */
.mk{position:absolute;background:rgba(23,28,44,.92);border:1px solid rgba(255,255,255,.13);border-radius:9px;
box-shadow:0 6px 18px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.06)}
.mk .t{font-size:11px;font-weight:600;color:#dfe5f2;white-space:nowrap}
.mk .s{font-size:10px;color:#8b94a8;white-space:nowrap}
.rowline{display:flex;align-items:center;justify-content:space-between}
.mk .pill{display:inline-block;font-size:9.5px;line-height:1;padding:3px 7px;border-radius:99px}
.p-blue{background:rgba(59,130,246,.2);color:#8fb5ff}
.p-red{background:rgba(244,117,111,.18);color:#f49a95}
.p-green{background:rgba(34,197,140,.16);color:#4fd6a5}
.p-gray{background:rgba(255,255,255,.1);color:#a7b0c2}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%}
.bar{border-radius:3px;background:linear-gradient(180deg,#60a5fa,#3b82f6)}
.bar.dim{background:rgba(255,255,255,.14)}
/* ═══ 动效 ═══ */
@keyframes k-lit{0%,100%{opacity:0}10%,32%{opacity:1}44%{opacity:0}}
.a-lit{animation:k-lit 3.6s infinite}
@keyframes k-blink{0%,100%{opacity:.2}50%{opacity:1}}
.a-blink{animation:k-blink 1.6s infinite}
@keyframes k-fly{0%,12%{transform:translate(0,0);opacity:1}48%,60%{transform:translate(64px,-6px);opacity:1}86%,100%{transform:translate(64px,-6px);opacity:0}}
.a-fly{animation:k-fly 3.8s ease-in-out infinite}
@keyframes k-rowhl{0%,18%{transform:translateY(0)}32%,43%{transform:translateY(25px)}57%,68%{transform:translateY(50px)}82%,94%{transform:translateY(0)}100%{transform:translateY(0)}}
.a-rowhl{animation:k-rowhl 5.6s ease-in-out infinite}
@keyframes k-pulse{0%,100%{opacity:.4}50%{opacity:1}}
.a-pulse{animation:k-pulse 2.2s ease-in-out infinite}
@keyframes k-trace{to{stroke-dashoffset:-20}}
.a-trace{stroke-dasharray:5 5;animation:k-trace 1.8s linear infinite}
@keyframes k-take{0%,18%{transform:translateY(0);opacity:1}36%,58%{transform:translateY(-14px);opacity:0}78%,100%{transform:translateY(0);opacity:1}}
.a-take{animation:k-take 4.6s ease-in-out infinite}
@keyframes k-write{0%{transform:scaleX(0)}16%,82%{transform:scaleX(1)}100%{transform:scaleX(0)}}
.a-write{transform-box:fill-box;transform-origin:0 50%;animation:k-write 4.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none !important}}
</style></head>
<body>
<div class="wrap">
<div class="head"><div><h1>工作台</h1><p>下午好，有 4 类事项等你处理</p></div><button class="pill"><b>✦</b>方案助手</button></div>

<button class="tile door">

  <i class="d-desc">待核价任务与成本底稿</i>

      <div class="s">待核价</div>
      <div class="t num" style="font-size:15px;color:#8fb5ff">12 单</div>
    </div>
  </span>
</button>

<button class="tile door">
  <span class="door-head"><span class="d-ic"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M5 2.5h7l3 3v12H5z"/><path d="M7.5 12.5l2 2 3.5-3.5"/></svg></span><strong>我的报价</strong></span>
  <i class="d-desc">待转报价任务与报价工作台</i>
  <span class="d-num num">43</span>
  <span class="door-art">
    <div class="mk" style="left:6px;top:6px;width:138px">
      <div class="t">Q20251103-01</div>
      <div class="s">L6 主机 ×2 … ¥96,800</div>

    </div>
    <div class="mk" style="left:104px;top:70px;width:78px">
      <div class="s">蓝湖数据</div>
      <div class="t num">¥9,880</div>
    </div>
  </span>
</button>

<button class="tile door">
  <span class="door-head"><span class="d-ic"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="3" y="3.5" width="14" height="13" rx="1.5"/><path d="M7.5 3.5v13M12.5 3.5v8"/></svg></span><strong>任务调度</strong></span>
  <i class="d-desc">无主指派与各节点负载</i>
  <span class="d-num num">10</span>
  <span class="door-art">
    <div class="mk" style="left:2px;top:8px;width:52px;height:64px"><div class="s" style="margin:5px 6px 0">配置</div></div>
    <div class="mk" style="left:62px;top:8px;width:52px;height:64px"><div class="s" style="margin:5px 6px 0">核价</div></div>
    <div class="mk" style="left:122px;top:8px;width:52px;height:64px;border-color:#3b82f6"><div class="s" style="margin:5px 6px 0">报价</div>
      <div class="pill p-blue" style="margin:6px">蓝湖</div>
    </div>
    <div class="mk a-fly" style="left:10px;top:30px;width:44px;height:20px;border-color:#3b82f6;display:flex;align-items:center;justify-content:center"><span class="pill p-blue">华远</span></div>
  </span>
</button>

</div>
</section>
<!-- MODS -->
</div>
</body></html>
<section class="sec">
