<title>ESA240 V3 · 3D 配置台样张</title>
<!--
  服务器3D配置台样张(2026-11-01)
  蓝本 = 服务器管理-图纸配置里 ESA240 V3(机型16)三视图标注 + 底座25档案:
  4U / 2×AMD 9004 / 24×DDR5 6400 / 8×双宽GPU直连 / 13×FHHL PCIe Gen5 + 1×OCP3.0
  CRPS 3+1 电源 / 12×6056 热插拔风扇 / 12×3.5" 前置盘位 / 双挂耳
  工艺 = 程序化参数化建模(零美术资产):低模几何 + 发光贴边 + bloom 泛光 + 动效
  方向 = 科技感/炫酷(深空蓝+玻璃+辉光),非写实金属
  引库惯例同 宣传视频-工作台首页一屏式.html(jsdelivr three importmap)
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    background: #0a1526;
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #dfe9f5;
  }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; }
  /* 暗角,压住四周让主体聚焦 */
  #vignette {
    position: fixed; inset: 0; pointer-events: none; z-index: 2;
    background: radial-gradient(ellipse at 50% 42%, transparent 58%, rgba(1,4,10,.4) 100%);
  }
  .hud { position: fixed; z-index: 5; }
  .glass {
    background: rgba(9, 16, 30, .68);
    border: 1px solid rgba(122, 200, 255, .16);
    border-radius: 12px;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 8px 32px rgba(0, 0, 0, .45);
  }
  /* 左上:标题 */
  #title { top: 18px; left: 18px; padding: 12px 16px; }
  #title .t1 { font-size: 15px; font-weight: 700; letter-spacing: .06em; }
  #title .t1 b { color: #4cc9f0; font-weight: 800; }
  #title .t2 { margin-top: 3px; font-size: 11px; color: #7d8ba1; letter-spacing: .04em; }
  /* 右上:控制台 */
  #panel { top: 18px; right: 18px; padding: 12px; width: 216px; }
  #panel .sec { margin-bottom: 10px; }
  #panel .sec:last-child { margin-bottom: 0; }
  #panel .lab {
    font-size: 10px; color: #6b7a92; letter-spacing: .18em; margin-bottom: 6px;
  }
  .btnrow { display: flex; gap: 6px; flex-wrap: wrap; }
  .btn {
    appearance: none; border: 1px solid rgba(122, 200, 255, .22);
    background: rgba(20, 34, 58, .55); color: #cfe2f5;
    font-size: 12px; padding: 5px 10px; border-radius: 8px; cursor: pointer;
    transition: all .18s ease; letter-spacing: .03em;
  }
  .btn:hover { border-color: rgba(122, 200, 255, .55); background: rgba(30, 52, 88, .7); }
  .btn.on {
    background: rgba(28, 84, 128, .75); border-color: #4cc9f0; color: #e8f7ff;
    box-shadow: 0 0 12px rgba(76, 201, 240, .35);
  }
  .stepper { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 3px 0; }
  .stepper .sname { font-size: 12px; color: #a8bad0; }
  .stepper .sctrl { display: flex; align-items: center; gap: 8px; }
  .stepper button {
    width: 22px; height: 22px; border-radius: 6px; cursor: pointer; font-size: 13px; line-height: 1;
    border: 1px solid rgba(122, 200, 255, .22); background: rgba(20, 34, 58, .55); color: #cfe2f5;
  }
  .stepper button:hover { border-color: rgba(122,200,255,.55); }
  .stepper .sval { min-width: 20px; text-align: center; font-size: 13px; font-weight: 700; color: #4cc9f0; font-variant-numeric: tabular-nums; }
  /* 左下:部件清单 */
  #legend { bottom: 18px; left: 18px; padding: 10px 14px; display: flex; gap: 14px; align-items: center; }
  #legend .li { font-size: 11px; color: #93a6bf; display: flex; align-items: center; gap: 5px; white-space: nowrap; }
  #legend .li b { color: #e6f2ff; font-size: 12px; }
  #legend .dot { width: 6px; height: 6px; border-radius: 50%; background: #4cc9f0; box-shadow: 0 0 6px rgba(76,201,240,.9); }
  #legend .dot.v { background: #a78bfa; box-shadow: 0 0 6px rgba(167,139,250,.9); }
  #legend .dot.g { background: #34d399; box-shadow: 0 0 6px rgba(52,211,153,.9); }
  /* 右下:FPS */
  #fps { bottom: 18px; left: 50%; transform: translateX(-50%); padding: 6px 12px; font-size: 11px; color: #7d8ba1;
         font-variant-numeric: tabular-nums; letter-spacing: .08em; }
  #fps b { color: #34d399; font-size: 13px; }
  /* 悬浮提示 */
  #tip {
    position: fixed; z-index: 9; pointer-events: none; display: none;
    padding: 7px 11px; max-width: 260px;
    background: rgba(8, 14, 26, .88); border: 1px solid rgba(122, 200, 255, .35);
    border-radius: 9px; font-size: 12px; line-height: 1.55; color: #d7e5f5;
    box-shadow: 0 6px 24px rgba(0,0,0,.5); backdrop-filter: blur(10px);
  }
  #tip b { color: #4cc9f0; display: block; margin-bottom: 1px; font-size: 12.5px; }
  #tip .sub { color: #8fa2bb; font-size: 11px; }
  /* 点击固定的信息卡 */
  #card {
    position: fixed; z-index: 8; right: 18px; bottom: 18px; width: 252px; display: none;
    padding: 14px 16px;
  }
  #card.show { display: block; }
  #card h3 { font-size: 14px; color: #4cc9f0; margin-bottom: 6px; letter-spacing: .04em; }
  #card p { font-size: 12px; color: #a8bad0; line-height: 1.65; }
  #card .chips { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 5px; }
  #card .chip {
    font-size: 10.5px; padding: 2px 8px; border-radius: 99px;
    background: rgba(76, 201, 240, .1); border: 1px solid rgba(76, 201, 240, .3); color: #9fd9f5;
  }
  #card .x {
    position: absolute; top: 8px; right: 10px; cursor: pointer; color: #6b7a92; font-size: 14px;
  }
  #card .x:hover { color: #cfe2f5; }
  /* 浅色主题(服务器配置页可切主题,3D台跟随) */
  body.light { color: #243247; background: #e6edf7; }
  body.light #vignette { background: radial-gradient(ellipse at 50% 42%, transparent 60%, rgba(120,140,170,.25) 100%); }
  body.light .glass { background: rgba(255,255,255,.74); border-color: rgba(70,110,160,.28); box-shadow: 0 8px 32px rgba(90,110,140,.28); }
  body.light #title .t1 { color: #1c2a3a; }
  body.light #title .t1 b { color: #0f6fa8; }
  body.light #title .t2, body.light .lab, body.light #fps, body.light .li, body.light .sname { color: #5d7391; }
  body.light .btn { background: rgba(255,255,255,.65); border-color: rgba(70,110,160,.32); color: #2a3c55; }
  body.light .btn:hover { border-color: rgba(30,110,180,.6); background: rgba(255,255,255,.9); }
  body.light .btn.on { background: rgba(120,190,240,.5); border-color: #1d7fc0; color: #0d2c47; box-shadow: 0 0 12px rgba(60,150,220,.3); }
  body.light .stepper button { background: rgba(255,255,255,.65); border-color: rgba(70,110,160,.32); color: #2a3c55; }
  body.light .sval { color: #0f6fa8; }
  body.light #tip { background: rgba(255,255,255,.94); border-color: rgba(70,110,160,.4); color: #243247; }
  body.light #tip b { color: #0f6fa8; }
  body.light #tip .sub { color: #5d7391; }
  body.light #card h3 { color: #0f6fa8; }
  body.light #card p { color: #45597a; }
  body.light #card .chip { background: rgba(30,130,200,.1); border-color: rgba(30,130,200,.35); color: #0f6fa8; }
  body.light #legend .li b { color: #243247; }
  body.light #fps b { color: #0e7a4e; }
  @media (max-width: 760px) {
    #panel { width: auto; right: 10px; top: 10px; left: auto; max-width: 46vw; }
    #title { left: 10px; top: 10px; max-width: 50vw; }
    #legend { display: none; }
    #card { right: 10px; bottom: 10px; width: calc(100vw - 20px); }
  }
</style>

  <div class="sec">

    <div class="btnrow" id="views">
      <button class="btn" data-v="front">正面</button>
      <button class="btn" data-v="rear">背面</button>

      <span class="sctrl">
        <button id="gpuMinus">−</button><span class="sval" id="gpuVal">8</span><button id="gpuPlus">＋</button>
      </span>
    </div>
    <div class="stepper">
      <span class="sname">CPU 处理器</span>
      <span class="sctrl">
        <button id="cpuMinus">−</button><span class="sval" id="cpuVal">2</span><button id="cpuPlus">＋</button>
      </span>
    </div>
    <div class="stepper">
      <span class="sname">3.5" 盘位</span>
      <span class="sctrl">
        <button id="bayMinus">−</button><span class="sval" id="bayVal">12</span><button id="bayPlus">＋</button>
      </span>

      <span class="sctrl">
        <button id="dimmMinus">−</button><span class="sval" id="dimmVal">24</span><button id="dimmPlus">＋</button>

  <span class="li"><span class="dot"></span>内存 <b>24</b></span>

<script type="module">
import * as THREE from 'three'
import { OrbitControls } from 'three/addons/controls/OrbitControls.js'
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js'
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js'
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js'
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js'
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js'

/* ───── 配置即入参(来自底座25档案/图纸标注) — 改这里=换机型 ───── */
const CFG = {
  form: '4U', bays: 12, fans: 12, cpus: 2, dimms: 24, gpus: 8,
  psu: { total: 4, active: 3 }, pcie: 13, ocp: 1,
  size: { W: 4.6, H: 1.78, D: 7.2 },   // 438mm×178mm×720mm 按米
}

/* ───── 部件语义(来自图纸 region 标注) — hover/点击弹这 ───── */
const PART_INFO = {
  drives: { name: '前置硬盘区', qty: () => `${state.bays}×3.5" 热插拔`,
    desc: 'SATA / SAS / NVMe 盘位,支持热插拔。对应图纸前视图「前置硬盘区(12×3.5")」标注。',
    chips: ['热插拔', 'SATA/SAS/NVMe', '图纸:前视图'] },
  ears: { name: '挂耳(指示灯/把手)', qty: () => '左电源键+状态灯 · 右VGA/USB',
    desc: '对应图纸前视图「左挂耳(指示灯/把手)」「右挂耳(VGA/USB/把手)」标注。',
    chips: ['电源键', '状态灯', '图纸:前视图'] },
  fans: { name: '风扇区', qty: () => `${CFG.fans}×6056 热插拔`,
    desc: '12×6056 热插拔风扇墙,整机散热风道第一级。对应图纸俯视图「风扇区」标注。',
    chips: ['6056', '热插拔', '图纸:俯视图'] },
  cpu: { name: 'CPU/内存区', qty: () => `${state.cpus}×AMD 9004/9005 · ${state.dimms}×DDR5 6400`,
    desc: '绿色主板上双路 AMD 9004/9005,内存一根根竖插成排(俯视图浅绿竖条)。对应图纸俯视图「CPU/内存区」标注。',
    chips: ['AMD 9004/9005', 'DDR5 6400', '图纸:俯视图'] },
  gpus: { name: 'GPU 区 · Switch板', qty: () => `${state.gpus}×双宽GPU 竖插一排`,
    desc: '深绿 Switch 板上竖插一排双宽 GPU(俯视图的一排竖线),CPU 直连 Passthrough,PCIe Gen5 x16。',
    chips: ['双宽', 'Passthrough', 'Gen5 x16', '图纸:俯视图'] },
  psu: { name: '电源区', qty: () => `CRPS ${CFG.psu.active}+1 冗余`,
    desc: 'CRPS 3+1 冗余电源(1300/1600/2000/2700W 可选)。对应图纸后视图「电源区(左/右)」标注。',
    chips: ['CRPS', '3+1 冗余', '图纸:后视图'] },
  pcie: { name: 'PCIe 扩展槽区', qty: () => `${CFG.pcie}×FHHL x16 + ${CFG.ocp}×OCP3.0`,
    desc: '13×FHHL PCIe Gen5 x16 + 1×OCP3.0 x8。对应图纸后视图「PCIe 扩展槽区」「主板IO区」标注。',
    chips: ['FHHL', 'Gen5 x16', 'OCP3.0', '图纸:后视图'] },
}

/* ───── 渲染基座 ───── */
const stage = document.getElementById('stage')
const renderer = new THREE.WebGLRenderer({ antialias: true })
renderer.setPixelRatio(Math.min(devicePixelRatio, 2))
renderer.setSize(innerWidth, innerHeight)
renderer.toneMapping = THREE.ACESFilmicToneMapping
renderer.toneMappingExposure = 1.15
renderer.shadowMap.enabled = true
renderer.shadowMap.type = THREE.PCFSoftShadowMap
stage.appendChild(renderer.domElement)

const scene = new THREE.Scene()
scene.background = new THREE.Color('#0a1526')
scene.fog = new THREE.FogExp2('#0a1526', 0.022)

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 200)
camera.position.set(20, 13, 20)

const controls = new OrbitControls(camera, renderer.domElement)
controls.target.set(0, 0.9, 0)
controls.enableDamping = true
controls.dampingFactor = 0.07
controls.minDistance = 3.5
controls.maxDistance = 40
controls.maxPolarAngle = Math.PI * 0.52
controls.autoRotate = true
controls.autoRotateSpeed = 0.85

const composer = new EffectComposer(renderer)
composer.addPass(new RenderPass(scene, camera))
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.85, 0.55, 0.72)
composer.addPass(bloom)
composer.addPass(new OutputPass())

/* ───── 灯光:1 主光 + 双氛围点光 + 低环境 ───── */
const ambient = new THREE.AmbientLight('#8fb4dd', 0.65)
scene.add(ambient)
const key = new THREE.DirectionalLight('#eaf4ff', 1.8)
key.position.set(7, 12, 6)
key.castShadow = true
key.shadow.mapSize.set(2048, 2048)
key.shadow.camera.left = -9; key.shadow.camera.right = 9
key.shadow.camera.top = 9; key.shadow.camera.bottom = -9
key.shadow.radius = 6
scene.add(key)
const rimCyan = new THREE.PointLight('#1e6fff', 7, 30); rimCyan.position.set(-8, 4, -8); scene.add(rimCyan)
const rimViolet = new THREE.PointLight('#7c3aed', 5, 30); rimViolet.position.set(8, 3, -9); scene.add(rimViolet)
const fillTop = new THREE.PointLight('#a5d8ff', 14, 16); fillTop.position.set(0, 4.2, 0.5); scene.add(fillTop)

/* ───── 地台:暗面 + 极坐标网格 + 发光环 ───── */
const floor = new THREE.Mesh(
  new THREE.CircleGeometry(34, 72),
  new THREE.MeshStandardMaterial({ color: '#0c1930', roughness: 0.92, metalness: 0.25 })
)
floor.rotation.x = -Math.PI / 2; floor.position.y = -0.08; floor.receiveShadow = true
scene.add(floor)
let grid = null
function buildGrid(c1, c2) {
  if (grid) { scene.remove(grid); grid.geometry.dispose(); grid.material.dispose() }
  grid = new THREE.PolarGridHelper(30, 12, 8, 72, c1, c2)
  grid.position.y = -0.07
  scene.add(grid)
}
function glowRing(r, color, inten) {
  const m = new THREE.Mesh(
    new THREE.TorusGeometry(r, 0.02, 8, 128),
    new THREE.MeshBasicMaterial({ color })
  )
  m.material.color.multiplyScalar(inten)
  m.rotation.x = -Math.PI / 2; m.position.y = -0.04
  scene.add(m); return m
}
const ringA = glowRing(4.6, '#21a8ff', 1.6)
const ringB = glowRing(5.1, '#7c5cff', 0.9)

/* ───── 材质工厂(共享,少材质=少切换) ───── */
const M = {
  body:  new THREE.MeshStandardMaterial({ color: '#2e4059', metalness: 0.6, roughness: 0.45 }),
  dark:  new THREE.MeshStandardMaterial({ color: '#1c2a40', metalness: 0.55, roughness: 0.55 }),
  glass: new THREE.MeshStandardMaterial({ color: '#9fd4ff', metalness: 0, roughness: 0.3,
           transparent: true, opacity: 0.10, depthWrite: false }),
  edge:  new THREE.MeshBasicMaterial({ color: new THREE.Color('#2fbcff').multiplyScalar(1.9) }),
  cyan:  new THREE.MeshBasicMaterial({ color: new THREE.Color('#37c8ff').multiplyScalar(2.0) }),
  violet:new THREE.MeshBasicMaterial({ color: new THREE.Color('#9a6bff').multiplyScalar(1.2) }),
  green: new THREE.MeshBasicMaterial({ color: new THREE.Color('#2fe6a8').multiplyScalar(2.1) }),
  amber: new THREE.MeshBasicMaterial({ color: new THREE.Color('#ffb454').multiplyScalar(1.7) }),
  dim:   new THREE.MeshBasicMaterial({ color: new THREE.Color('#1d3a5c').multiplyScalar(1.2) }),
  fin:   new THREE.MeshStandardMaterial({ color: '#3d5378', metalness: 0.7, roughness: 0.35 }),
  board:  new THREE.MeshStandardMaterial({ color: '#1f8a4c', metalness: 0.3, roughness: 0.5 }),
  boardDk:new THREE.MeshStandardMaterial({ color: '#14532d', metalness: 0.3, roughness: 0.55 }),
  dimm:   new THREE.MeshStandardMaterial({ color: '#4ade80', metalness: 0.25, roughness: 0.4, emissive: '#166534', emissiveIntensity: 0.3 }),
  cpuCap: new THREE.MeshBasicMaterial({ color: new THREE.Color('#38bdf8').multiplyScalar(1.4) }),
}
function box(w, h, d, mat, r = 0.02) {
  const m = new THREE.Mesh(new RoundedBoxGeometry(w, h, d, 2, r), mat)
  m.castShadow = true; m.receiveShadow = true
  return m
}

/* ───── 整机 ───── */
const machine = new THREE.Group()
scene.add(machine)
const { W, H, D } = CFG.size
const parts = []            // 可爆炸部件 { g, base, off }
const glowMats = {}        // partKey → [发光材质, 原始色]
function part(key, off) {
  const g = new THREE.Group()
  g.userData.part = key
  g.userData.off = off
  machine.add(g)
  parts.push({ g, base: null, off })
  return g
}
function tagGlow(key, mat) { (glowMats[key] = glowMats[key] || []).push(mat); return mat }

/* 机身外壳(底 + 两侧 + 后 + 前框,顶留空给玻璃盖) */
{
  const t = 0.07
  const shell = part('shell', new THREE.Vector3(0, 0, 0))
  const bottom = box(W, t, D, M.body); bottom.position.y = t / 2; shell.add(bottom)
  for (const s of [-1, 1]) {
    const side = box(t, H - t, D, M.body)
    side.position.set(s * (W - t) / 2, t + (H - t) / 2, 0); shell.add(side)
  }
  const back = box(W - 2 * t, H - t, t, M.body)
  back.position.set(0, t + (H - t) / 2, -(D - t) / 2); shell.add(back)
  // 侧面发光刻线(分段短划,弱亮度)
  for (const s of [-1, 1]) {
    for (let seg = 0; seg < 4; seg++) {

function applyTheme(name) {
  const t = THEMES[name]
  state.theme = name
  state.themeGlassBase = t.glassBase
  scene.background.set(t.bg)
  scene.fog.color.set(t.bg)
  floor.material.color.set(t.floor)
  buildGrid(t.grid1, t.grid2)
  M.body.color.set(t.body)
  M.dark.color.set(t.dark)
  M.fin.color.set(t.fin)
  M.glass.color.set(t.glass)
  M.board.color.set(t.board)
  M.boardDk.color.set(t.boardDk)
  ambient.intensity = t.amb
  key.intensity = t.key
  fillTop.intensity = t.fill
  rimCyan.intensity = t.rimC
  rimViolet.intensity = t.rimV
  bloom.strength = t.bloom
  bloom.threshold = t.bloomThr
  renderer.toneMappingExposure = t.exp
  document.body.classList.toggle('light', name === 'light')
  const bt = document.querySelector('#btnTheme')
  if (bt) bt.textContent = name === 'light' ? '深色模式' : '浅色模式'
}

$('#dimmMinus').addEventListener('click', () => setDimms(state.dimms - 1))
$('#dimmPlus').addEventListener('click', () => setDimms(state.dimms + 1))
$('#cpuMinus').addEventListener('click', () => setCpus(state.cpus - 1))
$('#cpuPlus').addEventListener('click', () => setCpus(state.cpus + 1))
$('#btnTheme').addEventListener('click', () => applyTheme(state.theme === 'light' ? 'dark' : 'light'))
$('#cardClose').addEventListener('click', () => { pinnedKey = null; card.classList.remove('show') })

function showCard(key) {
  const info = PART_INFO[key]
  if (!info) return
  $('#cardTitle').textContent = info.name
  $('#cardDesc').textContent = info.desc
  const chips = info.chips.concat([info.qty()])
  $('#cardChips').innerHTML = chips.map(c => `<span class="chip">${c}</span>`).join('')
  card.classList.add('show')
}

/* 拾取 */
const ray = new THREE.Raycaster()
const ptr = new THREE.Vector2()
let hovered = null
const KEY_ALIAS = { front: 'drives', ears: 'ears', fans: 'fans', cpu: 'cpu', gpus: 'gpus', rear: 'psu', cover: 'cover', shell: 'shell' }
function resolveKey(obj) {
  let o = obj
  while (o && o !== scene) {
    if (o.userData && o.userData.part) {
      const k = o.userData.part
      return KEY_ALIAS[k] || (PART_INFO[k] ? k : null)
    }
    o = o.parent
  }
  return null
}
renderer.domElement.addEventListener('pointermove', (e) => {
  ptr.x = (e.clientX / innerWidth) * 2 - 1
  ptr.y = -(e.clientY / innerHeight) * 2 + 1
  ray.setFromCamera(ptr, camera)
  const hits = ray.intersectObjects(machine.children, true)
  let key = null
  const chainVisible = (o) => { for (let p = o; p && p !== machine; p = p.parent) if (p.visible === false) return false; return true }
  for (const h of hits) {
    if (!chainVisible(h.object)) continue
    key = resolveKey(h.object)
    if (key) break
  }
  hovered = key
  if (key) {
    const info = PART_INFO[key]
    tip.style.display = 'block'
    tip.style.left = Math.min(e.clientX + 14, innerWidth - 270) + 'px'
    tip.style.top = (e.clientY + 14) + 'px'
    tip.innerHTML = `<b>${info.name}</b>${info.qty()}<span class="sub">点击固定详情</span>`
    document.body.style.cursor = 'pointer'
  } else {
    tip.style.display = 'none'
    document.body.style.cursor = ''
  }
})
renderer.domElement.addEventListener('click', () => {
  if (hovered) { pinnedKey = hovered; showCard(pinnedKey) }
})

/* ───── 入场镜头 ───── */
flyTo({ pos: [6.4, 4.1, 9.6], tgt: [0, 0.9, 0] }, { resumeRotate: true })
camTween.dur = 2.2

/* 调试句柄(控制台排障用) */
window.__proto3d = { scene, machine, M, state, topCover }

/* ───── 主循环 ───── */
const clock = new THREE.Clock()
let fpsAcc = 0, fpsN = 0, fpsT = 0
const easeOut = (x) => 1 - Math.pow(1 - x, 3)
const easeInOut = (x) => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2

function tick() {
  requestAnimationFrame(tick)
  const dt = Math.min(clock.getDelta(), 0.05)
  const t = clock.elapsedTime

  // 镜头补间
  // 先 update 泄掉阻尼增量(飞行中 autoRotate 已关,不会加新旋转),再覆盖补间位姿
  controls.update()
  if (camTween) {
    camTween.t += dt / camTween.dur
    const k = easeInOut(Math.min(camTween.t, 1))
    camera.position.lerpVectors(camTween.p0, camTween.p1, k)
    controls.target.lerpVectors(camTween.g0, camTween.g1, k)
    camera.lookAt(controls.target)
    if (camTween.t >= 1) {
      if (camTween.resumeRotate) {
        controls.autoRotate = true
        document.querySelector('#btnRotate').classList.add('on')
      }
      camTween = null
    }
  }

  // 爆炸插值
  state.explode += (state.explodeTarget - state.explode) * (1 - Math.exp(-dt * 5))
  for (const p of parts) {
    p.g.position.copy(p.base).addScaledVector(p.off, easeOut(state.explode))
  }
  M.glass.opacity = state.themeGlassBase - 0.06 * state.explode

  // 呼吸 / 闪烁 / 旋转
  const breath = 1.1 + 0.45 * Math.sin(t * 2.1)
  earGlow.forEach(m => m.color.set('#37c8ff').multiplyScalar(breath))
  ringA.material.color.set('#21a8ff').multiplyScalar(1.2 + 0.35 * Math.sin(t * 1.4))
  for (const f of fanSpinners) f.s.rotation.z += dt * f.v
  for (const m of driveLEDs) {
    m.color.set('#2fe6a8').multiplyScalar(Math.random() < 0.015 ? 2.6 : 1.2 + 0.25 * Math.sin(t * 3 + Math.random()))
  }
  for (const m of psuGlow) m.color.set('#2fe6a8').multiplyScalar(1.5 + 0.3 * Math.sin(t * 2.6))

  // pop-in 补间
  machine.traverse((o) => {
    if (o.userData.pop != null) {
      o.userData.pop = Math.min(o.userData.pop + dt * 4, 1)
      const s = 0.6 + 0.4 * easeOut(o.userData.pop)
      o.scale.setScalar(s)
      if (o.userData.pop >= 1) { o.scale.setScalar(1); o.userData.pop = undefined }
    }
  })

  // 悬停发光
  for (const [k, mats] of Object.entries(glowMats)) {
    const on = k === hovered || (k === pinnedKey)
    for (const m of mats) {
      if (m.userData.base == null) m.userData.base = m.color.clone()
      const want = on ? 2.2 : 1.0
      m.userData.lerp = (m.userData.lerp ?? 1) + (want - (m.userData.lerp ?? 1)) * (1 - Math.exp(-dt * 9))
      m.color.copy(m.userData.base).multiplyScalar(m.userData.lerp)
    }
  }

  const dust = scene.getObjectByName('dust')
  if (dust) { dust.rotation.y += dt * 0.01; dust.position.y = Math.sin(t * 0.18) * 0.3 }

  controls.update()
  composer.render()

  fpsAcc += dt; fpsN++
  if ((fpsT += dt) >= 0.5) {
    $('#fpsVal').textContent = Math.round(fpsN / fpsAcc)
    fpsAcc = 0; fpsN = 0; fpsT = 0
  }
}
tick()

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight
  camera.updateProjectionMatrix()
  renderer.setSize(innerWidth, innerHeight)
  composer.setSize(innerWidth, innerHeight)
})
</script>
