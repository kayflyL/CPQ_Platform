<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><style>
body{margin:0;background:#0a0f1e;color:#e8ecf5;font-family:"Segoe UI",system-ui,"PingFang SC","Microsoft YaHei",sans-serif;
--cpq-glass-border:rgba(255,255,255,.1);--cpq-glass-border-strong:rgba(255,255,255,.2);
--cpq-glass-card-bg:rgba(255,255,255,.045);--cpq-glass-card-blur:12px;
--cpq-text-primary:#e8ecf5;--cpq-text-secondary:#b7c0d4;--cpq-text-muted:#8b94a8;
--cpq-accent-primary:#3b82f6;}

/* ── 材料系统（照 Supabase 实测值）：不透明暖灰实心面 + 顶边内嵌高光 + 页顶一道品牌辉光；整页固定中性暗色，免疫主题开关 ── */
.portal {
  --p-bg: #131316;
  --p-panel: #1c1c1f;
  --p-panel-hover: #212126;
  --p-border: rgba(255, 255, 255, 0.12);
  --p-border-hover: rgba(255, 255, 255, 0.22);
  --p-t1: #ededed;
  --p-t2: #b4b4b4;
  --p-t3: #8f8f8f;
  position: relative;
  
  
}
.portal-main{max-width:1200px;margin:0 auto;padding:26px 24px}
.portal-head { display: flex; align-items: flex-start; gap: 16px; margin-bottom: 24px; }
.ph-l h2 { margin: 0; font-size: 24px; font-weight: 650; letter-spacing: -0.02em; color: var(--p-t1); }
.ph-l p { margin: 6px 0 0; font-size: 13px; color: var(--p-t3); }
.ai-pill {
  margin-left: auto;
  display: flex; align-items: center; gap: 8px;
  border: 1px solid var(--p-border);
  background: var(--p-panel);
  color: var(--p-t2);
  border-radius: 8px; padding: 8px 16px;
  font-size: 13px; cursor: pointer; transition: all 0.15s;
}
.ai-pill:hover { color: var(--p-t1); border-color: var(--cpq-accent-primary, #1677ff); }
.ai-spark { color: var(--cpq-accent-primary, #1677ff); }
.sec { margin-bottom: 28px; }
/* Supabase 式 eyebrow：等宽字 + 宽字距 + 「//」前缀点睛 */
.sec-t { margin: 0 0 10px; font-family: ui-monospace, Consolas, 'Courier New', monospace; font-size: 12px; font-weight: 500; color: var(--p-t3); letter-spacing: 2px; }
.sec-t::before { content: '// '; color: var(--cpq-accent-primary, #1677ff); }
/* ── 独立圆角面板（Supabase 式）：1px 边框 + 玻璃底，无影，hover 亮边框 ── */
.doors { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 14px; }
.mods { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
.tile {
  position: relative;
  border: 1px solid var(--p-border);
  border-radius: 16px;
  background: var(--p-panel);
  box-shadow: inset 0 1px 0 0 rgba(255, 255, 255, 0.07);
  overflow: hidden;
  cursor: pointer;
  text-align: left;
  padding: 0;
  min-width: 0;
  transition: background 0.15s, border-color 0.15s;
}
.tile:hover { background: var(--p-panel-hover); border-color: var(--p-border-hover); }
.tile:hover .d-ic { color: var(--cpq-accent-primary, #1677ff); }
.door { display: block;  padding: 20px 22px; }
.door-head { display: flex; align-items: center; gap: 10px; }
.door-head strong { font-size: 16px; font-weight: 650; color: var(--p-t1); }
.d-desc { display: block; margin-top: 7px; font-style: normal; font-size: 12.5px; color: var(--p-t3); }
.d-num {
  position: absolute; top: 16px; right: 20px;
  font-size: 32px; font-weight: 300; line-height: 1;
  font-variant-numeric: tabular-nums;
  color: var(--p-t2);
  transition: color 0.15s;
}
.door:hover .d-num { color: var(--cpq-accent-primary, #1677ff); }
.d-ic { display: flex; color: var(--p-t3); transition: color 0.15s; }
.d-ic svg { width: 20px; height: 20px; }
.d-ic.sm svg { width: 17px; height: 17px; }
.door-art {
  position: absolute; right: 16px; bottom: 12px;
  width: 52%; height: 62%;
  pointer-events: none;
  color: var(--p-t1);
  background-image: radial-gradient(rgba(255, 255, 255, 0.10) 1px, transparent 1.5px);
  background-size: 13px 13px;
}
.door-art svg { width: 100%; height: 100%; }

/* ── 功能板块卡：图标标题同行 + 底部示意画 ── */
.mod { display: block;  padding: 20px; }
.mod strong { font-size: 15px; font-weight: 650; color: var(--p-t1); }
.mod .d-desc { margin-top: 8px; }
.mod-art {
  position: absolute; left: 18px; right: 18px; bottom: 14px;
  height: 96px;
  pointer-events: none;
  color: var(--p-t1);
  background-image: radial-gradient(rgba(255, 255, 255, 0.10) 1px, transparent 1.5px);
  background-size: 13px 13px;
}
.mod-art svg { width: 100%; height: 100%; }


/* ── 移动端：门卡单列、板块卡两列 ── */

/* ── 原型覆盖：上图下文 + 玻璃同源材料 + 动效 ── */
.portal{--p-t1:#e8ecf5;--p-t2:#b7c0d4;--p-t3:#8b94a8}
.tile{border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.045);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:inset 0 1px 0 0 rgba(255,255,255,.07)}
.tile:hover{background:rgba(255,255,255,.07);border-color:rgba(122,167,255,.4)}
.doors{grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}
.door{min-height:152px}
.door-art{width:54%;height:74%}
.mod{display:flex;flex-direction:column;padding:0;min-height:242px}
.mod-art{position:relative;inset:auto;height:132px;flex:none;border-bottom:1px solid rgba(255,255,255,.06)}
.mod-art svg{position:absolute;bottom:6px}
.mod-body{padding:14px 18px 18px}
.mod-body strong{font-size:15px;font-weight:650}
.mod-body i{display:block;margin-top:5px;font-style:normal;font-size:12.5px;color:#8b94a8}
.d-ic{display:none}
/* ── 动效关键帧 ── */
@keyframes k-lit{0%,100%{opacity:0}10%,32%{opacity:1}44%{opacity:0}}
.a-lit{animation:k-lit 3.6s infinite}
@keyframes k-rise{from{transform:scaleY(.12)}to{transform:scaleY(1)}}
.a-rise{transform-box:fill-box;transform-origin:50% 100%;animation:k-rise 2.4s ease-in-out infinite alternate}
@keyframes k-write{0%{transform:scaleX(0)}16%,82%{transform:scaleX(1)}100%{transform:scaleX(0)}}
.a-write{transform-box:fill-box;transform-origin:0 50%;animation:k-write 4.4s ease-in-out infinite}
@keyframes k-fly{0%,12%{transform:translateX(0);opacity:1}48%,60%{transform:translateX(52px);opacity:1}86%,100%{transform:translateX(52px);opacity:0}}
.a-fly{animation:k-fly 3.8s ease-in-out infinite}
@keyframes k-rowhl{0%,18%{transform:translateY(0)}32%,43%{transform:translateY(18px)}57%,68%{transform:translateY(36px)}82%,94%{transform:translateY(54px)}100%{transform:translateY(0)}}
.a-rowhl{animation:k-rowhl 5.6s ease-in-out infinite}
@keyframes k-blink{0%,100%{opacity:.15}50%{opacity:1}}
.a-blink{animation:k-blink 1.6s infinite}
@keyframes k-take{0%,18%{transform:translateY(0);opacity:1}36%,58%{transform:translateY(-12px);opacity:0}78%,100%{transform:translateY(0);opacity:1}}
.a-take{animation:k-take 4.6s ease-in-out infinite}
@keyframes k-trace{to{stroke-dashoffset:-20}}
.a-trace{stroke-dasharray:5 5;animation:k-trace 1.8s linear infinite}
@keyframes k-pulse{0%,100%{opacity:.4}50%{opacity:1}}
.a-pulse{animation:k-pulse 2.2s ease-in-out infinite}
@keyframes k-draw{0%{stroke-dashoffset:16}38%,64%{stroke-dashoffset:0}100%{stroke-dashoffset:16}}
.a-draw{stroke-dasharray:16;animation:k-draw 3.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none !important}}
</style></head><body>
