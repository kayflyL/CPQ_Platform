<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>机型详情 · 产品能力数据流画布 — 原型</title>
<!-- 最后更新：2026-09-27
  参考 n8n 首页「人格左栏 + 活画布」模式，映射到机型详情页「产品能力」带：
  左栏 = 现有 capabilities 六维（数据/编辑器零改动），右侧 = 整机数据流 SVG 画布，
  选中维度点亮对应子图 + 主题色脉冲，metrics 数字以玻璃芯片标注在主节点下。
  旧 2 列静态网格卡整体替换。数据源：l6.server_models id=6 (ES220 V3) 真实 capabilities。 -->
<style>
:root{
  --sun-color:#5BB8FF; --sun-bright:#D6EBFF; --glow:rgba(91,184,255,0.55);
  --band-bg:linear-gradient(to bottom,#02050f 0%,#0a1c38 55%,#030814 100%);
  --page-bg:linear-gradient(to bottom,#02050f 0%,#071226 45%,#030814 100%);
  --line-soft:rgba(255,255,255,0.08);
  --mono:'JetBrains Mono','SF Mono','Cascadia Mono',Consolas,monospace;
  --ease:cubic-bezier(.4,0,.2,1);
  --cycle:4.5s;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--page-bg);color:#eef3fa;font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;min-height:100vh;transition:background .5s}

/* ── 原型工具条（非页面内容） ── */
.chrome{display:flex;justify-content:space-between;align-items:center;padding:16px 28px;border-bottom:1px solid rgba(255,255,255,.06)}
.chrome .ttl{font-size:12.5px;color:rgba(255,255,255,.5);letter-spacing:.02em}
.chrome .ttl b{color:rgba(255,255,255,.8);font-weight:600}
.pills{display:flex;gap:8px}
.pill{display:inline-flex;align-items:center;gap:7px;padding:5px 13px;border-radius:999px;border:1px solid rgba(255,255,255,.13);background:transparent;color:rgba(255,255,255,.55);cursor:pointer;font-size:12px;transition:.2s}
.pill .dot{width:9px;height:9px;border-radius:50%}
.pill.on{border-color:var(--sun-color);color:#fff}

/* ── 产品能力带（对应详情页 .band-dark，全幅暗色带 + 顶部主题光带） ── */
.band-dark{margin-top:44px;padding:52px 0 60px;position:relative;color:#fff;
  background-image:linear-gradient(to bottom,rgba(0,0,0,.42),rgba(0,0,0,.58)),var(--band-bg)}
.band-dark::before{content:'';position:absolute;top:0;left:-8%;right:-8%;height:0;
  background:linear-gradient(to right,transparent 0%,var(--sun-color) 22%,var(--sun-bright) 50%,var(--sun-color) 78%,transparent 100%);
  background-size:100% 1.5px;background-repeat:no-repeat;
  box-shadow:0 0 18px var(--sun-color),0 4px 46px var(--glow)}
.page-inner{max-width:1180px;margin:0 auto;padding:0 28px}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:28px}
.sec-kicker{font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--sun-color);opacity:.85;margin-bottom:8px}
.sec-title{font-size:23px;font-weight:700;color:#fff;letter-spacing:.02em}
.hint{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:rgba(255,255,255,.32)}

/* ── 左栏（维度） + 右画布 ── */
.cap-wrap{display:flex;gap:26px;align-items:stretch}

/* 左栏：n8n 人格列表的对应物 —— 能力维度 */
.rail{width:302px;flex:none;display:flex;flex-direction:column;gap:6px}
.item{position:relative;text-align:left;border:none;background:transparent;cursor:pointer;
  padding:13px 16px 15px 22px;border-radius:10px;border:1px solid transparent;color:inherit;font-family:inherit;
  transition:background .25s var(--ease),border-color .25s}
.item::before{content:'';position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:2px;background:transparent;transition:.25s}
.item:hover{background:rgba(255,255,255,.03)}
.item.active{background:rgba(255,255,255,.055);border-color:rgba(255,255,255,.07)}
.item.active::before{background:var(--sun-color);box-shadow:0 0 8px var(--glow)}
.item .row{display:flex;align-items:baseline;gap:9px;margin-bottom:5px}
.item .nm{font-size:15.5px;font-weight:700;color:rgba(245,250,255,.55);transition:.25s}
.item.active .nm{color:#fff}
.item .en{font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.3)}
.item.active .en{color:var(--sun-color);opacity:.75}
.item .desc{font-size:12.3px;line-height:1.58;color:rgba(238,243,250,.4);transition:.25s;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item.active .desc{color:rgba(238,243,250,.68)}
.item .prog{position:absolute;left:12px;right:14px;bottom:0;height:2px;border-radius:1px;width:0;background:var(--sun-color);box-shadow:0 0 6px var(--glow);opacity:0}
.item.active .prog{opacity:.8;animation:prog var(--cycle) linear forwards}
@keyframes prog{from{width:0}to{width:100%}}

/* 右画布：整机数据流（点阵底 + 发丝线节点 + 脉冲） */
.canvas-panel{flex:1;min-width:0;position:relative;border:1px solid var(--line-soft);border-radius:14px;
  background:
    radial-gradient(rgba(255,255,255,.065) 1px,transparent 1px) 0 0/22px 22px,
    linear-gradient(180deg,rgba(255,255,255,.028),rgba(255,255,255,.008));
  overflow:hidden}
.canvas-panel::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 90% at 50% 40%,transparent 55%,rgba(0,0,0,.32))}
.canvas-panel svg{display:block;width:100%;height:auto}

/* SVG 内元素 */
.edge .line{fill:none;stroke:rgba(255,255,255,.16);stroke-width:1.5}
.edge.mg .line{stroke:rgba(255,255,255,.13);stroke-dasharray:2 6;stroke-linecap:round}
.edge.air .line{stroke-dasharray:7 6}
.edge .pulse{fill:rgba(255,255,255,.5)}
.node{color:rgba(255,255,255,.5);transition:opacity .35s}
.node .box{fill:rgba(255,255,255,.03);stroke:rgba(255,255,255,.16);stroke-width:1;transition:.35s}
.node .nlabel{font-size:12.5px;font-weight:600;fill:rgba(245,250,255,.78);text-anchor:middle}
.node .nen{font-family:var(--mono);font-size:8.5px;letter-spacing:.2em;fill:rgba(255,255,255,.3);text-anchor:middle;text-transform:uppercase}
.node.ghost .nlabel{font-size:10.5px;font-weight:500;fill:rgba(255,255,255,.4)}
.node,.edge{transition:opacity .35s var(--ease)}
svg.has-active .node:not(.hl),svg.has-active .edge:not(.hl){opacity:.24}
.edge.hl .line{stroke:var(--sun-color);filter:drop-shadow(0 0 4px var(--glow))}
.edge.hl .pulse{fill:var(--sun-bright)}
.node.hl{color:#fff}
.node.hl .box{stroke:var(--sun-color);fill:rgba(255,255,255,.05);filter:drop-shadow(0 0 7px var(--glow))}
.node.hl .nlabel{fill:#fff}
.node.hl .nen{fill:var(--sun-color);opacity:.8}
.anno{opacity:0;transform:translateY(6px);transition:.45s var(--ease)}
.anno.show{opacity:1;transform:none}
.anno .chip{fill:rgba(255,255,255,.045);stroke:var(--sun-color);stroke-opacity:.45;stroke-width:1}
.anno text{font-family:var(--mono);font-size:11px;fill:var(--sun-bright);text-anchor:middle}

@media (prefers-reduced-motion:reduce){
  .pulse,.item .prog{display:none}
}
/* 手机：左栏变横滑条，画布居下（全站适配定式） */
@media (max-width:880px){
  .cap-wrap{flex-direction:column;gap:14px}
  .rail{width:100%;flex-direction:row;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
  .rail::-webkit-scrollbar{display:none}
  .item{min-width:236px;flex:none}
  .band-dark{margin-top:24px;padding:36px 0 44px}
}
</style>
</head>
<body>

<div class="chrome">
  <div class="ttl"><b>原型</b> · 机型详情页「产品能力」— n8n 式维度 × 数据流画布（替换旧 2 列网格卡）</div>
  <div class="pills" id="pills"></div>
</div>

<section class="band-dark">
  <div class="page-inner">
    <div class="sec-head">
      <div>
        <div class="sec-kicker">Capabilities</div>
        <div class="sec-title">产品能力</div>
      </div>

    </div>

    <div class="cap-wrap" id="wrap">

      <div class="canvas-panel">
        <svg id="canvas" viewBox="0 0 940 580" xmlns="http://www.w3.org/2000/svg" aria-label="整机数据流示意">
          <!-- ══ 连线（底层） ══ -->
          <!-- 内存通道 CPU↔DIMM（三通道并行线） -->
          <g class="edge" id="e-mem">
            <path class="line" d="M382,220 V124"/>
            <path class="line" d="M418,220 V124"/>

          </g>
          <!-- CPU → OCP 网络 -->
          <g class="edge" id="e-ocp">
            <path class="line" d="M433,256 C510,258 570,264 655,264"/>
            <circle class="pulse" r="2.6"><animateMotion dur="2.6s" repeatCount="indefinite" path="M433,256 C510,258 570,264 655,264"/></circle>
          </g>
          <!-- CPU → 存储 -->
          <g class="edge" id="e-stg">
            <path class="line" d="M433,272 C520,300 560,380 655,404"/>

          </g>
          <!-- PSU 供电 → CPU -->
          <g class="edge" id="e-pwr">

          </g>
          <!-- 风墙气流 → CPU（虚线） -->
          <g class="edge air" id="e-air">
            <path class="line" d="M143,340 C220,336 310,318 366,286"/>
            <circle class="pulse" r="2.4"><animateMotion dur="3.8s" repeatCount="indefinite" path="M143,340 C220,336 310,318 366,286"/></circle>

          <g class="edge" id="e-link">

          </g>
          <!-- BMC 带外管理（点线，n8n 子节点虚线的对应物） -->
          <g class="edge mg" id="e-mg1"><path class="line" d="M143,182 C230,196 300,220 368,240"/></g>
          <g class="edge mg" id="e-mg2"><path class="line" d="M143,192 C280,320 480,410 655,414"/></g>
          <g class="edge mg" id="e-mg3"><path class="line" d="M110,208 V434"/></g>

          <!-- ══ 节点 ══ -->
          <!-- CPU 处理器（枢纽） -->
          <g class="node" id="n-cpu" transform="translate(400,250)">
            <rect class="box" x="-33" y="-24" width="66" height="48" rx="9"/>
            <svg x="-23" y="-17" width="46" height="34" viewBox="0 0 52 40" fill="none"><rect x="12" y="8" width="28" height="24" rx="2" stroke="currentColor" stroke-width="1.5"/><rect x="19" y="15" width="14" height="10" rx="1" stroke="var(--sun-color,#5BB8FF)" stroke-width="1.5"/><path d="M18 8V3M24 8V3M30 8V3M34 8V3M18 32v-5M24 32v-5M30 32v-5M34 32v-5M12 14H7M12 20H7M12 26H7M40 14h5M40 20h5M40 26h5" stroke="currentColor" stroke-width="1.5"/></svg>
            <text class="nlabel" y="41">处理器</text><text class="nen" y="55">CPU</text>
          </g>
          <!-- DIMM 内存 -->
          <g class="node" id="n-dimm" transform="translate(400,96)">
            <rect class="box" x="-33" y="-24" width="66" height="48" rx="9"/>
            <svg x="-23" y="-17" width="46" height="34" viewBox="0 0 52 40" fill="none"><rect x="10" y="11" width="32" height="13" rx="1" stroke="currentColor" stroke-width="1.5"/><rect x="14" y="15" width="5" height="5" stroke="currentColor" stroke-width="1.2"/><rect x="21" y="15" width="5" height="5" stroke="currentColor" stroke-width="1.2"/><rect x="28" y="15" width="5" height="5" stroke="currentColor" stroke-width="1.2"/><path d="M13 24v5M18 24v5M23 24v5M28 24v5M33 24v5M38 24v5" stroke="currentColor" stroke-width="1.2"/><rect x="21" y="29" width="10" height="3" rx="0.5" fill="var(--sun-color,#5BB8FF)"/></svg>
            <text class="nlabel" y="41">内存</text><text class="nen" y="55">Memory</text>
          </g>
          <!-- PCIe 扩展 -->
          <g class="node" id="n-pcie" transform="translate(688,118)">
            <rect class="box" x="-33" y="-24" width="66" height="48" rx="9"/>
            <svg x="-23" y="-17" width="46" height="34" viewBox="0 0 52 40" fill="none"><rect x="4" y="5" width="36" height="8" rx="1" stroke="currentColor" stroke-width="1.5"/><rect x="4" y="16" width="36" height="8" rx="1" stroke="currentColor" stroke-width="1.5"/><rect x="4" y="27" width="36" height="8" rx="1" stroke="var(--sun-color,#5BB8FF)" stroke-width="1.5" stroke-dasharray="4 3"/><path d="M44 27v10M39 32h10" stroke="var(--sun-color,#5BB8FF)" stroke-width="1.5"/></svg>
            <text class="nlabel" y="41">扩展插槽</text><text class="nen" y="55">PCIe 5.0</text>
          </g>
          <!-- OCP 网络 -->
          <g class="node" id="n-ocp" transform="translate(688,262)">
            <rect class="box" x="-33" y="-24" width="66" height="48" rx="9"/>
            <svg x="-23" y="-17" width="46" height="34" viewBox="0 0 52 40" fill="none"><rect x="4" y="9" width="11" height="9" rx="1" stroke="currentColor" stroke-width="1.5"/><rect x="4" y="22" width="11" height="9" rx="1" stroke="currentColor" stroke-width="1.5"/><path d="M15 13.5h24m0 0-4-4m4 4-4 4M15 26.5h31m0 0-4-4m4 4-4 4" stroke="var(--sun-color,#5BB8FF)" stroke-width="1.5"/></svg>
            <text class="nlabel" y="41">网络</text><text class="nen" y="55">OCP 3.0</text>
          </g>
          <!-- 存储 -->
          <g class="node" id="n-stg" transform="translate(688,415)">
            <rect class="box" x="-33" y="-24" width="66" height="48" rx="9"/>
            <svg x="-23" y="-17" width="46" height="34" viewBox="0 0 52 40" fill="none"><rect x="10" y="5" width="32" height="9" rx="1" stroke="currentColor" stroke-width="1.5"/><rect x="10" y="16" width="32" height="9" rx="1" stroke="currentColor" stroke-width="1.5"/><rect x="10" y="27" width="32" height="9" rx="1" stroke="currentColor" stroke-width="1.5"/><circle cx="37" cy="9.5" r="1.6" fill="var(--sun-color,#5BB8FF)"/><circle cx="37" cy="20.5" r="1.6" fill="var(--sun-color,#5BB8FF)"/><circle cx="37" cy="31.5" r="1.6" fill="var(--sun-color,#5BB8FF)"/></svg>
            <text class="nlabel" y="41">存储盘位</text><text class="nen" y="55">Storage</text>
          </g>
          <!-- BMC 带外管理 -->

            <text class="nlabel" y="41">带外管理</text><text class="nen" y="55">BMC</text>
          </g>
          <!-- 散热风墙 -->
          <g class="node" id="n-fan" transform="translate(110,345)">
            <rect class="box" x="-33" y="-24" width="66" height="48" rx="9"/>
            <svg x="-23" y="-17" width="46" height="34" viewBox="0 0 52 40" fill="none"><circle cx="18" cy="20" r="13" stroke="currentColor" stroke-width="1.5"/><path d="M18 20c0-5 3-8 8-8M18 20c5 0 8 3 8 8M18 20c0 5-3 8-8 8M18 20c-5 0-8-3-8-8" stroke="currentColor" stroke-width="1.5"/><circle cx="18" cy="20" r="2.2" fill="var(--sun-color,#5BB8FF)"/><rect x="36" y="12" width="11" height="16" rx="1" stroke="currentColor" stroke-width="1.5"/><path d="M38.5 16h6M38.5 20h6" stroke="currentColor" stroke-width="1.2"/></svg>
            <text class="nlabel" y="41">散热风墙</text><text class="nen" y="55">Cooling</text>
          </g>

          <!-- ══ metrics 玻璃芯片（数据全部来自现有 capabilities.metrics） ══ -->
          <g class="anno" id="anno-compute"><rect class="chip" rx="6"/><text y="4"></text></g>
          <g class="anno" id="anno-scale"><rect class="chip" rx="6"/><text y="4"></text></g>
          <g class="anno" id="anno-net"><rect class="chip" rx="6"/><text y="4"></text></g>

          <g class="anno" id="anno-reliable"><rect class="chip" rx="6"/><text y="4"></text></g>
        </svg>
      </div>
    </div>
  </div>
</section>

<script>
/* ── 数据 = 现有 product_content.capabilities（ES220 V3 真实数据），结构零改动 ──
   nodes/edges/anno/cx/cy 是展示层常量（按维度写死在画布），不进业务数据。 */
const DIMS = [
  { id:'compute', name:'算力', en:'Compute',
    desc:'双路 AMD Genoa/Turin 高主频多核，虚拟化与数据库负载从容承载',
    nodes:['cpu','dimm'], edges:['e-mem'],
    anno:{ cx:400, cy:330, text:'2 路 高性能处理器 · 500W 单CPU TDP' } },
  { id:'scale', name:'扩展性', en:'Scalability',
    desc:'8 条 PCIe Gen5 x16 按需插卡，投资随业务爬坡，不为未来提前买单',
    nodes:['pcie','ocp'], edges:['e-pcie','e-ocp'],
    anno:{ cx:688, cy:196, text:'8× Gen5 x16 插槽 · 2× OCP 3.0 扩展位' } },
  { id:'net', name:'网络能力', en:'Network',
    desc:'双 OCP 3.0 Gen5 x16 高速网卡扩展位，集群南北向流量从容扩容',
    nodes:['ocp','fab'], edges:['e-ocp','e-link'],
    anno:{ cx:688, cy:340, text:'2× OCP 3.0 · Gen5 x16 专用带宽' } },
  { id:'storage', name:'存储', en:'Storage',
    desc:'前置 25 盘 2.5" + 后置 4 盘三模混插，冷热数据一机分层',
    nodes:['stg'], edges:['e-stg'],
    anno:{ cx:688, cy:494, text:'最大 29 盘 · 12× 3.5" 三模 · 2× M.2' } },
  { id:'mgmt', name:'管理', en:'Management',
    desc:'AST2600 带外管理 + TPM 2.0，固件批量下发，运维不用逐台进机房',
    nodes:['bmc'], edges:['e-mg1','e-mg2','e-mg3'],
    anno:{ cx:130, cy:246, text:'AST2600 带外管理 · TPM 2.0' } },
  { id:'reliable', name:'可靠与运维', en:'Reliability',
    desc:'1+1 冗余电源 + 6 风墙全程热插拔，7×24 稳定在线',
    nodes:['psu','fan'], edges:['e-pwr','e-air'],
    anno:{ cx:200, cy:546, text:'1+1 冗余 · 2000W 单电源 · 6× 热插拔风扇' } },
]

/* ── 左栏 ── */
const rail = document.getElementById('rail')
DIMS.forEach((d, i) => {
  const b = document.createElement('button')
  b.className = 'item'
  b.innerHTML = `<div class="row"><span class="nm">${d.name}</span><span class="en">${d.en}</span></div><div class="desc">${d.desc}</div><span class="prog"></span>`
  b.addEventListener('click', () => { select(i); startCycle() })
  rail.appendChild(b)
})

/* ── 画布选中 ── */
const svg = document.getElementById('canvas')
const annos = {}
DIMS.forEach(d => {
  const g = svg.querySelector('#anno-' + d.id)
  const text = g.querySelector('text'), rect = g.querySelector('rect')
  // 芯片宽度按中英混排估算
  let w = 28; for (const ch of d.anno.text) w += /[⺀-鿿＀-￯]/.test(ch) ? 11.5 : 6.7
  rect.setAttribute('x', d.anno.cx - w / 2); rect.setAttribute('y', d.anno.cy - 13)
  rect.setAttribute('width', w); rect.setAttribute('height', 26)
  text.setAttribute('x', d.anno.cx); text.setAttribute('y', d.anno.cy + 4); text.textContent = d.anno.text
  annos[d.id] = g
})
let cur = -1
function select(i) {
  if (i === cur) { restartProg(); return }
  cur = i
  document.querySelectorAll('.item').forEach((el, j) => {
    el.classList.toggle('active', j === i)
    if (j === i) { el.classList.remove('active'); void el.offsetWidth; el.classList.add('active') } // 重启进度条动画
  })
  const d = DIMS[i]
  svg.classList.add('has-active')
  svg.querySelectorAll('.node,.edge').forEach(el => el.classList.remove('hl'))
  d.nodes.forEach(id => svg.querySelector('#n-' + id)?.classList.add('hl'))
  d.edges.forEach(id => svg.querySelector('#' + id)?.classList.add('hl'))
  Object.values(annos).forEach(g => g.classList.remove('show'))
  annos[d.id].classList.add('show')
}
function restartProg() {
  const el = document.querySelectorAll('.item')[cur]
  if (!el) return
  el.classList.remove('active'); void el.offsetWidth; el.classList.add('active')
}

/* ── 自动轮播（悬停暂停）── */
const CYCLE = 4500
let timer = null
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches
function stopCycle() { if (timer) { clearInterval(timer); timer = null } }
function startCycle() {
  stopCycle()
  if (reduced) return
  timer = setInterval(() => select((cur + 1) % DIMS.length), CYCLE)
}
const wrap = document.getElementById('wrap')
wrap.addEventListener('mouseenter', stopCycle)
wrap.addEventListener('mouseleave', startCycle)
document.addEventListener('visibilitychange', () => document.hidden ? stopCycle() : startCycle())

/* ── 场景主题（stageThemes.ts 同源：酒红/深蓝/纯黑/暗紫）── */
const THEMES = {
  wine:   { label:'酒红', sun:'#FF7A4D', sunBright:'#FFE0C0', glow:'rgba(255,122,77,0.55)',
            band:'linear-gradient(to bottom,#160710 0%,#2d0b1a 55%,#1a0509 100%)',
            page:'linear-gradient(to bottom,#0d0308 0%,#1c0912 45%,#0f040a 100%)' },
  ocean:  { label:'深蓝', sun:'#5BB8FF', sunBright:'#D6EBFF', glow:'rgba(91,184,255,0.55)',
            band:'linear-gradient(to bottom,#02050f 0%,#0a1c38 55%,#030814 100%)',
            page:'linear-gradient(to bottom,#02050f 0%,#071226 45%,#030814 100%)' },
  carbon: { label:'纯黑', sun:'#E8E8E8', sunBright:'#FFFFFF', glow:'rgba(232,232,232,0.45)',
            band:'linear-gradient(to bottom,#0a0a0a 0%,#232323 55%,#050505 100%)',
            page:'linear-gradient(to bottom,#060606 0%,#161616 45%,#050505 100%)' },
  violet: { label:'暗紫', sun:'#B07AFF', sunBright:'#E8D0FF', glow:'rgba(176,122,255,0.55)',
            band:'linear-gradient(to bottom,#080114 0%,#20103f 55%,#0a0218 100%)',
            page:'linear-gradient(to bottom,#070113 0%,#180b30 45%,#0a0218 100%)' },
}
const pills = document.getElementById('pills')
Object.entries(THEMES).forEach(([k, t]) => {
  const p = document.createElement('button')
  p.className = 'pill'; p.dataset.k = k
  p.innerHTML = `<span class="dot" style="background:${t.sun}"></span>${t.label}`
  p.addEventListener('click', () => setTheme(k))
  pills.appendChild(p)
})
function setTheme(k) {
  const t = THEMES[k], s = document.documentElement.style
  s.setProperty('--sun-color', t.sun); s.setProperty('--sun-bright', t.sunBright)
  s.setProperty('--glow', t.glow); s.setProperty('--band-bg', t.band); s.setProperty('--page-bg', t.page)
  pills.querySelectorAll('.pill').forEach(p => p.classList.toggle('on', p.dataset.k === k))
}

/* ── 启动 ── */
setTheme('ocean')
select(0)
startCycle()
</script>
</body>
