<!DOCTYPE html>

<title>宣传实验 · 工作台首页拟真复刻（/portal）</title>
<style>
/* ═══════════ Design Tokens（逐值摘自 frontend/src/styles/tokens.css）═══════════ */
:root {
  --cpq-accent-primary: #1677FF;
  --cpq-accent-primary-light: #4096ff;
  --cpq-accent-danger: #FF6B6B;
  --cpq-color-success: #52C9A0;
  --cpq-radius-sm: 8px; --cpq-radius-md: 12px; --cpq-radius-lg: 16px;
  --cpq-ease-out-expo: cubic-bezier(.16, 1, .3, 1);
  --cpq-ease-smooth: cubic-bezier(.4, 0, .2, 1);
  --cpq-dur-1: 160ms; --cpq-dur-2: 280ms; --cpq-dur-3: 480ms;
  --cpq-stagger: 60ms;
  --cpq-font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif;
}
:root[data-theme='dark'] {
  color-scheme: dark;
  --cpq-bg-primary: #08090B; --cpq-bg-secondary: #101217; --cpq-bg-tertiary: #171a21;
  --cpq-text-primary: #E8ECEF; --cpq-text-secondary: #9BA1AA; --cpq-text-muted: #6E7582;
  --cpq-border-primary: rgba(255, 255, 255, 0.10); --cpq-border-secondary: rgba(255, 255, 255, 0.06); --cpq-border-light: rgba(255, 255, 255, 0.15);
  --cpq-overlay-w3: rgba(255, 255, 255, 0.03); --cpq-overlay-w5: rgba(255, 255, 255, 0.05); --cpq-overlay-w6: rgba(255, 255, 255, 0.06); --cpq-overlay-w8: rgba(255, 255, 255, 0.08); --cpq-overlay-w15: rgba(255, 255, 255, 0.15);
  --cpq-overlay-a8: rgba(22, 119, 255, 0.08); --cpq-overlay-a10: rgba(22, 119, 255, 0.10); --cpq-overlay-a15: rgba(22, 119, 255, 0.15);
  --cpq-shadow-color-soft: rgba(0, 0, 0, 0.30); --cpq-shadow-color-strong: rgba(0, 0, 0, 0.50); --cpq-overlay-b20: rgba(0, 0, 0, 0.20);
  --cpq-glass-3-bg: rgba(18, 24, 38, 0.75);
  --cpq-glass-border: rgba(255, 255, 255, 0.11);
  --cpq-glass-border-strong: rgba(22, 119, 255, 0.40);
  --cpq-glass-blur-3: 22px;
  --cpq-led-active-glow: 0 0 8px rgba(82, 201, 160, 0.65);
  --cpq-bg-gradient:
    radial-gradient(ellipse 70% 50% at 18% 0%, rgba(22, 119, 255, 0.10), transparent 60%),
    radial-gradient(ellipse 60% 45% at 88% 100%, rgba(114, 46, 209, 0.08), transparent 60%),
    linear-gradient(180deg, #0A0E1A 0%, #060810 100%);
}
:root[data-theme='light'] {
  color-scheme: light;
  --cpq-bg-primary: #F2F6FC; --cpq-bg-secondary: #F0F4FA; --cpq-bg-tertiary: #E8EEF6;
  --cpq-text-primary: #1d2129; --cpq-text-secondary: #4e5969; --cpq-text-muted: #86909c;
  --cpq-border-primary: rgba(22, 119, 255, 0.10); --cpq-border-secondary: rgba(22, 119, 255, 0.06); --cpq-border-light: rgba(22, 119, 255, 0.16);
  --cpq-overlay-w5: rgba(255, 255, 255, 0.36); --cpq-overlay-w6: rgba(255, 255, 255, 0.42); --cpq-overlay-w8: rgba(255, 255, 255, 0.48); --cpq-overlay-w15: rgba(255, 255, 255, 0.62);
  --cpq-overlay-a8: rgba(22, 119, 255, 0.08); --cpq-overlay-a10: rgba(22, 119, 255, 0.10); --cpq-overlay-a15: rgba(22, 119, 255, 0.15);
  --cpq-shadow-color-soft: rgba(22, 119, 255, 0.08); --cpq-shadow-color-strong: rgba(22, 119, 255, 0.14); --cpq-overlay-b20: rgba(255, 255, 255, 0.44);
  --cpq-glass-3-bg: rgba(255, 255, 255, 0.75);
  --cpq-glass-border: rgba(120, 144, 176, 0.38);
  --cpq-glass-border-strong: rgba(22, 119, 255, 0.45);
  --cpq-glass-blur-3: 16px;
  --cpq-led-active-glow: 0 0 6px rgba(82, 201, 160, 0.4);
  --cpq-bg-gradient:
    radial-gradient(ellipse 80% 60% at 12% 0%, rgba(22, 119, 255, 0.16), transparent 55%),
    radial-gradient(ellipse 65% 55% at 95% 15%, rgba(91, 143, 249, 0.12), transparent 60%),
    linear-gradient(180deg, #DCE9F8 0%, #E9F0FA 45%, #F2F6FC 100%);
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--cpq-font-family);
  font-size: 14px; color: var(--cpq-text-primary);
  background-color: var(--cpq-bg-primary);
  background-image: var(--cpq-bg-gradient); background-attachment: fixed;
  min-height: 100vh;
  transition: background-color .3s, color .3s;
}

/* ═══════════ 原型容器 chrome（参照 docs/prototypes 体系）═══════════ */
.proto-head { display: flex; align-items: center; gap: 12px; max-width: 1680px; margin: 0 auto; padding: 18px 20px 12px; }
.proto-head h1 { font-size: 18px; font-weight: 700; letter-spacing: .3px; }
.proto-sub { color: var(--cpq-text-muted); font-size: 12px; }
.proto-tools { margin-left: auto; display: flex; gap: 8px; }
.proto-btn {
  border: 1px solid var(--cpq-border-light); background: var(--cpq-overlay-w5); color: var(--cpq-text-secondary);
  border-radius: var(--cpq-radius-sm); padding: 5px 12px; font-size: 12px; cursor: pointer; transition: all .2s var(--cpq-ease-out-expo);
}
.proto-btn:hover { border-color: var(--cpq-glass-border-strong); color: var(--cpq-accent-primary); }
.proto-btn.active { background: var(--cpq-accent-primary); border-color: var(--cpq-accent-primary); color: #fff; }

.figure { max-width: 1680px; margin: 0 auto 34px; padding: 0 20px; }
.fig-title { margin-top: 12px; font-size: 14px; font-weight: 700; }
.fig-title em { font-style: normal; font-weight: 400; font-size: 12px; color: var(--cpq-text-muted); margin-left: 6px; }
.fig-note { margin-top: 4px; font-size: 12px; color: var(--cpq-text-muted); line-height: 1.8; }

/* 浏览器框 */
.browser { border-radius: 14px; overflow: hidden; border: 1px solid var(--cpq-glass-border);
  box-shadow: 0 24px 70px var(--cpq-shadow-color-strong); background: var(--cpq-bg-primary); }
.bchrome { display: flex; align-items: center; gap: 14px; padding: 9px 14px;
  background: var(--cpq-bg-secondary); border-bottom: 1px solid var(--cpq-border-primary); }
.bdots { display: flex; gap: 7px; flex: none; }
.bdots i { width: 11px; height: 11px; border-radius: 50%; }
.bdots i:nth-child(1) { background: #ff5f57; } .bdots i:nth-child(2) { background: #febc2e; } .bdots i:nth-child(3) { background: #28c840; }
.baddr { flex: 1; max-width: 460px; margin: 0 auto; display: flex; align-items: center; justify-content: center; gap: 6px;
  background: var(--cpq-overlay-w5); border: 1px solid var(--cpq-border-primary); border-radius: 8px;
  padding: 4px 12px; font-size: 11.5px; color: var(--cpq-text-muted); }
.baddr svg { width: 11px; height: 11px; flex: none; color: var(--cpq-color-success); }
.bsp { width: 47px; flex: none; }

/* ═══════════ 复刻区 ① 顶栏（DefaultLayout.site-header）═══════════ */
.demo { position: relative; }
.site-header { position: sticky; top: 0; z-index: 200;
  border-bottom: 1px solid transparent; background: transparent;
  transition: background-color var(--cpq-dur-3) var(--cpq-ease-smooth), border-color var(--cpq-dur-3) var(--cpq-ease-smooth); }
.site-header.is-scrolled { background: var(--cpq-glass-3-bg);
  -webkit-backdrop-filter: blur(var(--cpq-glass-blur-3)) saturate(1.35);
  backdrop-filter: blur(var(--cpq-glass-blur-3)) saturate(1.35);
  border-bottom-color: var(--cpq-border-secondary); }
.site-header-inner { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  width: min(calc(100% - 40px), 1680px); min-height: 56px; margin: 0 auto; padding: 6px 8px 6px 18px; }
.logo-area { display: flex; flex-direction: column; align-items: center; justify-content: center; flex-shrink: 0; }
.logo-text { font-size: 20px; font-weight: 700; color: var(--cpq-accent-primary); letter-spacing: 3px; line-height: 1; }
.logo-sub { font-size: 9px; color: var(--cpq-text-secondary); letter-spacing: 1.5px; margin-top: 2px; text-transform: uppercase; }
.primary-navigation { position: absolute; left: 50%; transform: translateX(-50%);
  display: flex; align-items: center; gap: clamp(14px, 1.6vw, 28px); }
.nav-link { position: relative; display: inline-flex; align-items: center; gap: 4px; padding: 14px 2px;
  font-size: 12px; font-weight: 600; letter-spacing: 0.02em; color: var(--cpq-text-secondary);
  white-space: nowrap; text-decoration: none; cursor: pointer;
  transition: color var(--cpq-dur-1) var(--cpq-ease-smooth); }
.nav-link:hover { color: var(--cpq-text-primary); }
.nav-link::after { content: ''; position: absolute; left: 0; right: 0; bottom: 6px; height: 2px; border-radius: 999px;
  background: var(--cpq-accent-primary); transform: scaleX(0); transform-origin: center;
  transition: transform 0.22s var(--cpq-ease-out-expo); }
.nav-link.is-active { color: var(--cpq-text-primary); }
.nav-link.is-active::after { transform: scaleX(1); }
.nav-caret { font-size: 9px; display: inline-flex; opacity: 0.7; }
.topbar-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
.action-pill { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 36px; padding: 0 12px;
  border-radius: var(--cpq-radius-md); border: 1px solid var(--cpq-border-secondary); background: var(--cpq-overlay-w5);
  color: var(--cpq-text-secondary); font-size: 12px; font-weight: 600; cursor: pointer;
  transition: color var(--cpq-dur-1) var(--cpq-ease-smooth), border-color var(--cpq-dur-1) var(--cpq-ease-smooth),
    background var(--cpq-dur-1) var(--cpq-ease-smooth), transform var(--cpq-dur-2) var(--cpq-ease-out-expo); }
.action-pill:hover { color: var(--cpq-text-primary); border-color: var(--cpq-glass-border-strong); background: var(--cpq-overlay-a8); transform: translateY(-1px); }
.action-pill.icon-pill { width: 36px; padding: 0; font-size: 15px; }
.action-pill svg { width: 15px; height: 15px; }
.user-name { max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.action-pill-wrap { position: relative; display: inline-flex; align-items: center; justify-content: center;
  min-height: 36px; min-width: 36px; padding: 0 6px; border-radius: var(--cpq-radius-md);
  border: 1px solid var(--cpq-border-secondary); background: var(--cpq-overlay-w5); cursor: pointer;
  transition: border-color var(--cpq-dur-1) var(--cpq-ease-smooth), background var(--cpq-dur-1) var(--cpq-ease-smooth), transform var(--cpq-dur-2) var(--cpq-ease-out-expo); }
.action-pill-wrap:hover { border-color: var(--cpq-glass-border-strong); background: var(--cpq-overlay-a8); transform: translateY(-1px); }
.action-pill-wrap svg { width: 15px; height: 15px; color: var(--cpq-text-secondary); }
.bell-badge { position: absolute; top: 3px; right: 2px; min-width: 15px; height: 15px; padding: 0 4px;
  border-radius: 999px; background: var(--cpq-accent-danger); color: #fff; font-size: 10px; font-weight: 600;
  display: flex; align-items: center; justify-content: center; line-height: 1; }
.online-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--cpq-color-success); box-shadow: var(--cpq-led-active-glow); }

/* ═══════════ 复刻区 ② 工作台首页（views/portal/Portal.vue）═══════════ */
.portal { position: relative; min-height: 100%; --gb: var(--cpq-glass-border); --hot: #f4756f; --sc-fade: var(--cpq-bg-primary); }
.portal-main { max-width: 1460px; margin: 0 auto; padding: 22px 30px 46px; position: relative; z-index: 1; }
.num { font-variant-numeric: tabular-nums; }

/* Hero · 信号波纹（配方逐值搬自 Portal.vue） */
.hero { position: relative; overflow: hidden; margin: 0 0 18px; padding: calc(57px + 34px) 30px 34px; min-height: 206px;
  background: radial-gradient(ellipse at 74% 130%, var(--sc-bg2), var(--sc-bg1) 72%); }
.hero::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 90px;
  background: linear-gradient(to bottom, transparent, var(--sc-fade)); pointer-events: none; }
.rings { position: absolute; right: 6%; top: 50%; transform: translateY(-50%); width: 320px; height: 320px; }
.rings i { position: absolute; left: 50%; top: 50%; border: 1px solid var(--sc-ring); border-radius: 50%; transform: translate(-50%, -50%); }
.rings i:nth-child(1) { width: 90px; height: 90px; }
.rings i:nth-child(2) { width: 160px; height: 160px; border-color: var(--sc-ring-dim); }
.rings i:nth-child(3) { width: 230px; height: 230px; border-color: var(--sc-ring-dim); }
.rings i:nth-child(4) { width: 300px; height: 300px; border-color: var(--sc-ring-faint); }
.sweep { position: absolute; inset: 0; border-radius: 50%;
  background: conic-gradient(from 0deg, var(--sc-sweep), transparent 75deg);
  animation: spin 7s linear infinite; filter: blur(3px); }
@keyframes spin { to { transform: rotate(360deg); } }
.rings::after { content: ''; position: absolute; left: 50%; top: 50%; width: 8px; height: 8px; border-radius: 50%;
  background: var(--sc-core); box-shadow: 0 0 14px var(--sc-core-glow); transform: translate(-50%, -50%);
  animation: core 2.4s ease-in-out infinite; }
@keyframes core { 0%, 100% { opacity: .5; } 50% { opacity: 1; } }
.blip { position: absolute; width: 6px; height: 6px; border-radius: 50%; background: var(--sc-blip);
  box-shadow: 0 0 10px var(--sc-blip-glow); animation: blip 3s infinite; }
.blip.b2 { animation-delay: 1.2s; background: var(--sc-blip2); box-shadow: 0 0 10px var(--sc-blip2-glow); }
.blip.b3 { animation-delay: 2s; }
@keyframes blip { 0%, 100% { opacity: .2; } 50% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .sweep, .blip, .rings::after { animation: none !important; } }
.hero > :not(.rings) { position: relative; z-index: 2; }
.hero h1 { font-size: 23px; font-weight: 650; letter-spacing: -.02em; color: var(--sc-t1); }
.hero .sub { margin-top: 6px; font-size: 13px; color: var(--sc-t2); }
.today { position:relative; display: flex; flex-wrap: wrap; gap: 9px; margin-top: 16px; }
.tchip { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--sc-chiptx);
  background: var(--sc-chipbg); border: 1px solid var(--sc-chipbd); border-radius: 99px; padding: 6px 13px; }
.tchip b { color: var(--sc-core); font-weight: 600; }
.tchip.hot b { color: #f4756f; }
.tchip:hover { border-color: rgba(122, 167, 255, .45); }
.slogan { position: absolute; right: 28px; top: calc(57px + 24px); text-align: right; font-size: 13px; color: var(--sc-slog); letter-spacing: 2px; }

/* 场景变量（非 scoped 原样搬：默认暗色场景，浅色主题切日间版） */
.portal { --sc-bg1: #04070f; --sc-bg2: #0a1e3d; --sc-ring: rgba(122, 167, 255, .15); --sc-ring-dim: rgba(122, 167, 255, .09);
  --sc-ring-faint: rgba(122, 167, 255, .05); --sc-sweep: rgba(122, 167, 255, .17); --sc-core: #8fb5ff; --sc-core-glow: rgba(122, 167, 255, .9);
  --sc-blip: #7aa7ff; --sc-blip-glow: rgba(122, 167, 255, .9); --sc-blip2: #4fd6a5; --sc-blip2-glow: rgba(79, 214, 165, .9);
  --sc-t1: #fff; --sc-t2: rgba(226, 234, 248, .75); --sc-chiptx: rgba(233, 240, 252, .85); --sc-chipbg: rgba(255, 255, 255, .06);
  --sc-chipbd: rgba(255, 255, 255, .16); --sc-slog: rgba(205, 216, 238, .55); }
html[data-theme='light'] .portal { --sc-bg1: #f4f8ff; --sc-bg2: #d8e8fd; --sc-ring: rgba(59, 130, 246, .18); --sc-ring-dim: rgba(59, 130, 246, .10);
  --sc-ring-faint: rgba(59, 130, 246, .05); --sc-sweep: rgba(59, 130, 246, .10); --sc-core: #2f6fe4; --sc-core-glow: rgba(59, 130, 246, .55);
  --sc-blip: #2f6fe4; --sc-blip-glow: rgba(59, 130, 246, .5); --sc-blip2: #149d82; --sc-blip2-glow: rgba(20, 157, 130, .5);
  --sc-t1: var(--cpq-text-primary); --sc-t2: var(--cpq-text-secondary); --sc-chiptx: #33415c;
  --sc-chipbg: rgba(255, 255, 255, .65); --sc-chipbd: rgba(59, 130, 246, .25); --sc-slog: rgba(90, 118, 168, .75); }

/* 流程条 + 常用功能（逐值搬） */
.chip { width: 36px; height: 36px; border-radius: 10px; background: rgba(59, 130, 246, .14); color: var(--cpq-accent-primary);
  display: grid; place-items: center; flex: none; }
.chip svg { width: 18px; height: 18px; }
.flowrow { display: grid; grid-template-columns: 1fr 284px; gap: 14px; margin-bottom: 18px; }
.flow { position:relative; border: 1px solid var(--gb); border-radius: 14px; background: var(--card); backdrop-filter: blur(12px);
  box-shadow: inset 0 1px 0 0 rgba(255, 255, 255, .07); padding: 18px 22px; }
.portal { --card: linear-gradient(135deg, var(--cpq-overlay-w6) 0%, var(--cpq-overlay-w3) 40%, var(--cpq-overlay-b20) 100%); }
html[data-theme='light'] .flow, html[data-theme='light'] .act { box-shadow: inset 0 1px 0 0 rgba(255, 255, 255, .8), 0 4px 14px var(--cpq-shadow-color-soft); }
.flow .h { font-size: 14px; font-weight: 600; }
.flow .h span { margin-left: 10px; font-size: 12px; color: var(--cpq-text-muted); font-weight: 400; }
.fnodes { display: flex; align-items: center; gap: 6px; margin-top: 16px; }
.fnode { flex: 1; display: flex; align-items: center; gap: 12px; min-width: 0; cursor: pointer; }
.fnode:hover .fico { border-color: rgba(122, 167, 255, .65); background: rgba(59, 130, 246, .24); }
.fnode:hover .n { color: var(--cpq-accent-primary); }
.fico { width: 42px; height: 42px; border-radius: 50%; background: rgba(59, 130, 246, .12); color: var(--cpq-accent-primary);
  display: grid; place-items: center; flex: none; border: 1px solid rgba(122, 167, 255, .25);
  transition: border-color .15s, background .15s; }
.fico svg { width: 19px; height: 19px; }
.fnode .n { font-size: 13.5px; font-weight: 600; color: var(--cpq-text-primary); display: block; }
.fnode .c { font-size: 12px; color: var(--cpq-text-muted); margin-top: 2px; display: block; }
.fnode .c b { color: var(--cpq-accent-primary); font-weight: 600; }
.farrow { color: var(--cpq-text-muted); flex: none; }
.aicard { position:relative; border: 1px solid rgba(59, 130, 246, .3); border-radius: 14px;
  background: linear-gradient(140deg, rgba(59, 130, 246, .12), rgba(14, 165, 233, .04) 60%), var(--card);
  box-shadow: inset 0 1px 0 0 rgba(255, 255, 255, .09); padding: 16px 18px; display: flex; flex-direction: column; }
.aicard .h { display: flex; align-items: center; gap: 9px; font-size: 13.5px; font-weight: 600; color: var(--cpq-text-primary); }
.aicard .h .ai { width: 28px; height: 28px; border-radius: 8px; background: rgba(59, 130, 246, .25);
  display: grid; place-items: center; font-size: 11px; color: #cfe0ff; font-weight: 700; }
.aicard p { margin-top: 8px; font-size: 12px; color: var(--cpq-text-muted); line-height: 1.6; }
.aicard button { margin-top: auto; align-self: flex-start; font-size: 12px; color: var(--cpq-accent-primary);
  background: rgba(59, 130, 246, .12); border: 1px solid rgba(59, 130, 246, .35); border-radius: 8px; padding: 6px 13px; cursor: pointer; }
.sec-h { display: flex; align-items: baseline; gap: 10px; margin: 2px 2px 12px; font-size: 14px; font-weight: 600; }
.sec-h span { font-size: 12px; color: var(--cpq-text-muted); font-weight: 400; }
.acts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 18px; }
.act { position:relative; display: flex; align-items: center; gap: 12px; border: 1px solid var(--gb); border-radius: 12px; background: var(--card);
  backdrop-filter: blur(12px); box-shadow: inset 0 1px 0 0 rgba(255, 255, 255, .07); padding: 14px 16px; cursor: pointer;
  transition: background .15s, border-color .15s; }
.act:hover { background: var(--cpq-overlay-w8); border-color: rgba(122, 167, 255, .4); }
.act .chip { width: 38px; height: 38px; }
.act .ax { flex: 1; min-width: 0; }
.act .ax b { display: block; font-size: 13.5px; font-weight: 600; color: var(--cpq-text-primary); }
.act .ax i { display: block; font-style: normal; font-size: 11.5px; color: var(--cpq-text-muted); margin-top: 3px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.act .chev { color: var(--cpq-text-muted); flex: none; }

/* ═══════════ 标注层（note-dot 悬停提示，body.show-notes 门控）═══════════ */
.rel { position: relative; }
.note-anchor { position: absolute; z-index: 40; }
.note-dot { width: 18px; height: 18px; border-radius: 50%; background: var(--cpq-accent-primary); color: #fff;
  font-size: 11px; display: flex; align-items: center; justify-content: center; cursor: help;
