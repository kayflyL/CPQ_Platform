# CPQ 前端静态 + /api 反代（含 WebSocket）
# 安装: sudo cp deploy/nginx-cpq.conf /etc/nginx/sites-available/cpq \
#   && sudo ln -sf /etc/nginx/sites-available/cpq /etc/nginx/sites-enabled/cpq \
#   && sudo rm -f /etc/nginx/sites-enabled/default \
#   && sudo nginx -t && sudo systemctl reload nginx
server {
    listen 80;
    server_name _;                 # 有域名后替换为域名,再走 certbot --nginx 升 HTTPS

    client_max_body_size 100m;     # BOM/Excel 导入与附件上传

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    root /opt/cpq/frontend-dist;
    index index.html;

    # 后端全部流量(REST + 助手/通知/协同三条 ws)都在 /api 前缀下,与 vite dev 代理同构
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket 升级
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # skill 运行/LLM 长请求单次可达数分钟,nginx 默认 60s 会掐断
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
