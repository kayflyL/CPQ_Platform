<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- PWA：添加到主屏幕后以独立窗口全屏运行（无浏览器地址栏/工具栏） -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#F2F6FC" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="CPQ" />
    <!-- viewport-fit=cover：独立模式下页面延伸到刘海/状态栏下方，配合布局壳的 safe-area-inset 让位 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>CPQ Platform</title>
    <script>
      // 首屏前同步确定主题：读取用户已保存的选择，否则跟随系统，兜底浅色。
      // 必须在 CSS 第一帧之前把 data-theme 写到 <html>，刷新才不会闪现错误主题，
      // 也避免图表/Antd 在 data-theme 与 isDark 未对齐的那一帧按错主题渲染（如饼图黑边）。
      (function () {
        var t;
        try {
          t = localStorage.getItem('cpq-theme');
        } catch (e) {
          t = null;
        }
        if (t !== 'dark' && t !== 'light') {
          t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = t;
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
