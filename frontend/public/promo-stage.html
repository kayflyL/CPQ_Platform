<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<title>宣传录制舞台 · 实机模式</title>
<style>
html, body { height: 100%; margin: 0; overflow: hidden; }
body { background: #08090B; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  display: flex; flex-direction: column; color: #E8ECEF; }
.brand { flex: none; display: flex; align-items: baseline; gap: 12px; padding: 10px 20px 6px; }
.brand b { font-size: 14px; font-weight: 700; letter-spacing: 2px; color: #1677FF; }
.brand span { font-size: 12px; color: #6E7582; }
.main { flex: 1; min-height: 0; display: grid; grid-template-columns: 300px 1fr; gap: 18px; padding: 2px 20px 12px; }
.rail { display: flex; flex-direction: column; justify-content: center; gap: 30px; min-height: 0; }
.sc { position: relative; padding: 4px 2px 14px; cursor: pointer; opacity: .3; transition: opacity .5s; }
.sc b { display: block; font-size: 17px; font-weight: 700; color: #E8ECEF; }
.sc .bar { position: absolute; left: 2px; right: 100%; bottom: 0; height: 2px; border-radius: 2px; background: #1677FF; }
.sc.on { opacity: 1; }
.sc.on b { color: #1677FF; }
.stage { position: relative; min-width: 0; min-height: 0; }
.stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #08090B; }
.cursor { position: absolute; z-index: 400; pointer-events: none; opacity: 0; font-size: 18px; }
</style>
</head>
<body>
<div class="brand"><b>霄擎算力 · CPQ Platform</b><span>实机演示模式（骨架验证）</span></div>
<div class="main">
  <div class="rail">
    <div class="sc" data-step="0"><b>整层楼，都是 AI 同事</b><div class="bar"></div></div>
    <div class="sc" data-step="1"><b>Manage Teams 一站管理</b><div class="bar"></div></div>
    <div class="sc" data-step="2"><b>工作流：需求分析</b><div class="bar"></div></div>
  </div>
  <div class="stage">
    <iframe id="appFrame" src="/ai-office"></iframe>
  </div>
</div>
<script>
var frame = document.getElementById('appFrame');
frame.addEventListener('load', function () {
  try {
    var d = frame.contentDocument;
    var r = { url: frame.contentWindow.location.pathname,
      hasCanvas: !!d.querySelector('canvas'),
      hasShell: !!d.querySelector('.ai-office-shell') };
    document.title = 'PROBE:' + JSON.stringify(r);
  } catch (e) { document.title = 'PROBE-ERR:' + e.message; }
});
</script>
</body>
</html>
