<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<title>宣传录制舞台 · 首页（实机快照底稿）</title>
<style>
html, body { height: 100%; margin: 0; overflow: hidden; }
body { background: #08090B; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  display: flex; flex-direction: column; color: #E8ECEF; }
.brand { flex: none; display: flex; align-items: baseline; gap: 12px; padding: 10px 20px 6px; }
.brand b { font-size: 14px; font-weight: 700; letter-spacing: 2px; color: #1677FF; }
.brand span { font-size: 12px; color: #6E7582; }
.brand .hint { margin-left: auto; font-size: 11.5px; color: #6E7582; }
.main { flex: 1; min-height: 0; display: grid; grid-template-columns: 300px 1fr; gap: 18px; padding: 2px 20px 12px; }
.rail { display: flex; flex-direction: column; justify-content: center; gap: 34px; min-height: 0; }
.sc { position: relative; padding: 4px 2px 14px; cursor: pointer; opacity: .3; transition: opacity .5s cubic-bezier(.16,1,.3,1); }
.sc b { display: block; font-size: 17px; font-weight: 700; color: #E8ECEF; margin-bottom: 5px; }
.sc .bar { position: absolute; left: 2px; right: 100%; bottom: 0; height: 2px; border-radius: 2px; background: #1677FF; }
.sc.on { opacity: 1; }
.sc.on b { color: #1677FF; }
.stage { position: relative; min-width: 0; min-height: 0; overflow: hidden; border-radius: 12px;
  border: 1px solid rgba(255,255,255,.11); box-shadow: 0 24px 70px rgba(0,0,0,.5); background: #F2F6FC; }
.scaler { position: absolute; transform-origin: top left; }
.scaler iframe { width: 1600px; height: 1000px; border: 0; display: block; }
/* 覆盖层：纱罩 + 镜头洞 + 光标（坐标与 iframe 内真实元素对齐） */
.overlay { position: absolute; inset: 0; z-index: 300; pointer-events: none; opacity: 0; transition: opacity .5s; }
.overlay.show { opacity: 1; }
.lens { position: absolute; border-radius: 16px; box-shadow: 0 0 0 9999px rgba(3, 6, 14, .5), inset 0 0 0 1px rgba(122,167,255,.35), 0 0 26px rgba(122,167,255,.3);
  transition: left .7s cubic-bezier(.16,1,.3,1), top .7s cubic-bezier(.16,1,.3,1), width .7s cubic-bezier(.16,1,.3,1), height .7s cubic-bezier(.16,1,.3,1); }
.cursor { position: absolute; z-index: 400; pointer-events: none; opacity: 0; transition: opacity .4s, left .9s cubic-bezier(.16,1,.3,1), top .9s cubic-bezier(.16,1,.3,1); }
.cursor .ring { position: absolute; left: -9px; top: -9px; width: 36px; height: 36px; border-radius: 50%;
  border: 2px solid rgba(122, 167, 255, .9); opacity: 0; transform: scale(.4); }
.cursor.click .ring { animation: cring .5s cubic-bezier(.16,1,.3,1); }
@keyframes cring { 0% { opacity: .95; transform: scale(.35); } 100% { opacity: 0; transform: scale(1.15); } }
.cursor svg { display: block; width: 21px; height: 21px; filter: drop-shadow(0 2px 6px rgba(0,0,0,.45)); }
.ctrl { position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%); display: flex; gap: 8px; z-index: 500; transition: opacity .6s; }
.ctrl.fade { opacity: .1; }
.ctrl button { border: 1px solid rgba(255,255,255,.15); background: rgba(255,255,255,.08); color: #9BA1AA;
  border-radius: 99px; padding: 5px 14px; font-size: 12px; cursor: pointer; }
/* 注入 iframe 的演示高亮样式 */
.demo-pulse { animation: dpulse 1.1s cubic-bezier(.16,1,.3,1) 2; }
@keyframes dpulse { 0%,100% { box-shadow: 0 0 0 0 rgba(22,119,255,0); } 50% { box-shadow: 0 0 0 6px rgba(22,119,255,.35); } }
.demo-glow { outline: 2px solid rgba(22,119,255,.55); outline-offset: 2px; border-radius: 4px; }
.scenetab { font-size: 12px; font-weight: 600; padding: 4px 12px; border-radius: 99px; cursor: pointer;
  border: 1px solid rgba(255,255,255,.15); color: #9BA1AA; }
.scenetab:hover { color: #1677FF; border-color: rgba(22,119,255,.4); }
</style>
</head>
<body>

<div class="brand">
  <b>霄擎算力 · CPQ Platform</b>
  <span>工作台首页 · 实机快照演示</span>
  <span class="hint">空格播放/暂停 · R 重播 · 点左侧标题跳步 · 底稿=真实系统渲染快照</span><span class="scenetab" data-go="portal-stage.html" style="opacity:.55;pointer-events:none">工作台首页</span><span class="scenetab" data-go="ai-office-stage.html">AI 办公室</span>
</div>

<div class="main">
  <div class="rail l">
    <div class="sc" data-step="0"><b>一个顶栏，七个模块</b><div class="bar"></div></div>
    <div class="sc" data-step="1"><b>进门三秒，看清今天</b><div class="bar"></div></div>
    <div class="sc" data-step="2"><b>五道工位，一条流水线</b><div class="bar"></div></div>
    <div class="sc" data-step="3"><b>方案助手，随叫随到</b><div class="bar"></div></div>
    <div class="sc" data-step="4"><b>常用功能，按人生成</b><div class="bar"></div></div>
  </div>
  <div class="stage">
    <div class="scaler" id="scaler">
      <iframe id="snap" src="portal.html"></iframe>
      <div class="overlay" id="veil"><div class="lens" id="lens"></div></div>
      <div class="cursor" id="cursor"><span class="ring"></span><svg viewBox="0 0 24 24"><path d="M5 3l13.5 8.2-5.8 1.3 3 6.8-2.7 1.2-3-6.9L5 18z" fill="#fff" stroke="#1c2430" stroke-width="1.2" stroke-linejoin="round"/></svg></div>
    </div>
  </div>
</div>

<div class="ctrl" id="ctrl">
  <button id="playBtn">⏸ 暂停</button>
  <button onclick="restart()">⟳ 重播</button>
</div>

<script>
document.querySelectorAll('.scenetab[data-go]').forEach(function (t) {
  t.addEventListener('click', function () { location.href = t.dataset.go; });
});
var STEPS = [
  { sel: '.site-header',      title: 0, ms: 5200, cur: [{ t: 350, s: '.primary-navigation a:nth-child(4)' }, { t: 2400, s: '.topbar-actions .connection-pill' }] },
  { sel: '.hero',             title: 1, ms: 6000, cur: [{ t: 300, s: '.today .tchip' }, { t: 2800, s: '.hero .rings' }] },
  { sel: '.flow',             title: 2, ms: 7000, cur: [{ t: 250, s: '.fnodes a:nth-of-type(1)' }, { t: 1300, s: '.fnodes a:nth-of-type(2)' }, { t: 2350, s: '.fnodes a:nth-of-type(2)', click: true }, { t: 3250, s: '.fnodes a:nth-of-type(4)' }, { t: 4250, s: '.fnodes a:nth-of-type(5)' }],
    seq: [{ t: 2350, run: pulseFlow }, { t: 3500, run: pulseFlow }] },
  { sel: '.aicard',           title: 3, ms: 5200, cur: [{ t: 300, s: '.aicard p' }, { t: 1900, s: '.aicard button', click: true }] },
  { sel: '.acts',             title: 4, ms: 6500, cur: [{ t: 250, s: '.acts .act:nth-child(1)' }, { t: 1500, s: '.acts .act:nth-child(2)' }, { t: 2900, s: '.acts .act:nth-child(8)' }, { t: 4200, s: '.acts .act:nth-child(6)' }] }
];
var STEP_MS = 5200;

var scaler = document.getElementById('scaler');
var frame = document.getElementById('snap');
var doc = null, win = null;

frame.addEventListener('load', function () {
  doc = frame.contentDocument; win = frame.contentWindow;
  /* 注入演示高亮样式到真实页面 */
  var st = doc.createElement('style');
  st.textContent = '.demo-pulse { animation: dpulse 1.1s cubic-bezier(.16,1,.3,1) 2; }' +
    '@keyframes dpulse { 0%,100% { box-shadow: 0 0 0 0 rgba(22,119,255,0); } 50% { box-shadow: 0 0 0 6px rgba(22,119,255,.35); } }' +
    '.demo-glow { outline: 2px solid rgba(22,119,255,.55); outline-offset: 2px; border-radius: 4px; }';
  doc.head.appendChild(st);
  fit();
  requestAnimationFrame(function(){ requestAnimationFrame(function(){ play(); }); });
});

function fit() {
  var st = document.querySelector('.stage');
  var aw = st.clientWidth - 4, ah = st.clientHeight - 4;
  if (aw <= 0 || ah <= 0) return;
  var s = Math.max(0.1, Math.min(aw / 1600, ah / 1000, 1.15));
  scaler.style.width = Math.round(1600 * s) + 'px';
  scaler.style.height = Math.round(1000 * s) + 'px';
  frame.style.transform = 'scale(' + s + ')';
  frame.style.transformOrigin = 'top left';
  st.dataset.scale = s;
}
window.addEventListener('resize', fit);
document.addEventListener('visibilitychange', fit);

/* 真实元素 → 舞台坐标（同源：可读 iframe 内部布局） */
function posInStage(el) {
  var r = el.getBoundingClientRect();
  var f = frame.getBoundingClientRect();
  var sc = parseFloat(document.querySelector('.stage').dataset.scale || '1');
  /* lens 在 scaler 坐标系内（scaler 原点=iframe 原点），不再叠加外层偏移 */
  return { l: r.left * sc, t: r.top * sc, w: r.width * sc, h: r.height * sc };
}
function q(sel) { return doc ? doc.querySelector(sel) : null; }

var veil = document.getElementById('veil'), lens = document.getElementById('lens');
function positionLens(sel, pad) {
  var el = q(sel);
  if (!el || !el.offsetWidth) { veil.classList.remove('show'); return; }
  var p = posInStage(el); pad = pad || 12;
  lens.style.left = Math.max(0, p.l - pad) + 'px';
  lens.style.top = Math.max(0, p.t - pad) + 'px';
  lens.style.width = (p.w + pad * 2) + 'px';
  lens.style.height = (p.h + pad * 2) + 'px';
  veil.classList.add('show');
}

function runCursorTrack(i) {
  var cur = document.getElementById('cursor');
  var track = (STEPS[i] && STEPS[i].cur) || [];
  if (!track.length) { cur.style.opacity = 0; return; }
  cur.style.opacity = 1;
  track.forEach(function (wp) {
    stepTimers.push(setTimeout(function () {
      var el = q(wp.s);
      if (!el) return;
      var p = posInStage(el);
      var x = p.l + p.w / 2 + (wp.dx || 0), y = p.t + p.h / 2 + (wp.dy || 0);
      var dx = x - (parseFloat(cur.style.left) || 0), dy = y - (parseFloat(cur.style.top) || 0);
      cur.style.transitionDuration = Math.max(420, Math.min(1050, Math.sqrt(dx * dx + dy * dy) * 0.9)) + 'ms';
      cur.style.left = x + 'px'; cur.style.top = y + 'px';
      if (wp.click) {
        setTimeout(function () {
          cur.classList.add('click');
          el.classList.add('demo-pulse');
          setTimeout(function () { cur.classList.remove('click'); el.classList.remove('demo-pulse'); }, 900);
        }, 320);
      }
    }, wp.t));
  });
}

function pulseFlow() {
  var nodes = doc.querySelectorAll('.fnodes .fnode');
  for (var i = 0; i < nodes.length; i++) {
    nodes[i].classList.remove('demo-pulse');
    void nodes[i].offsetWidth;
    nodes[i].classList.add('demo-pulse');
  }
}

var cur = -1, timer = null, playing = false, stepTimers = [];
function clearStepTimers() { stepTimers.forEach(clearTimeout); stepTimers = []; }
function clearAll() { clearTimeout(timer); clearStepTimers(); }

function showStep(i) {
  clearAll();
  fit();
  cur = i % STEPS.length;
  var st = STEPS[cur];
  positionLens(st.sel);
  runCursorTrack(cur);
  (st.seq || []).forEach(function (it) { stepTimers.push(setTimeout(it.run, it.t)); });
  var ms = st.ms || STEP_MS;
  var cards = document.querySelectorAll('.sc');
  for (var j = 0; j < cards.length; j++) {
    var on = +cards[j].dataset.step === cur;
    cards[j].classList.toggle('on', on);
    var bar = cards[j].querySelector('.bar');
    bar.style.transition = 'none'; bar.style.right = '100%';
    if (on) {
      void bar.offsetWidth;
      bar.style.transition = 'right ' + ms + 'ms linear';
      bar.style.right = '0%';
    }
  }
  timer = setTimeout(function () { showStep(cur + 1); }, ms);
}
function restart() { showStep(0); }
function togglePlay() {
  if (playing) { playing = false; clearTimeout(timer); clearStepTimers();
    document.getElementById('playBtn').textContent = '▶ 播放'; }
  else { playing = true; document.getElementById('playBtn').textContent = '⏸ 暂停';
    timer = setTimeout(function () { showStep(cur + 1); }, 2000); }
}
document.getElementById('playBtn').addEventListener('click', togglePlay);
document.querySelectorAll('.sc').forEach(function (c) {
  c.addEventListener('click', function () { var was = cur; showStep(+c.dataset.step); if (playing && +c.dataset.step === was) togglePlay(), togglePlay(); });
});
document.addEventListener('keydown', function (e) {
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  if (e.key === 'r' || e.key === 'R') restart();
});
var idleT = null, ctrl = document.getElementById('ctrl');
function wake() { ctrl.classList.remove('fade'); clearTimeout(idleT); idleT = setTimeout(function(){ ctrl.classList.add('fade'); }, 2500); }
document.addEventListener('mousemove', wake);
</script>
</body>
</html>
