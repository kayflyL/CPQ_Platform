<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 办公室 · 房间化聊天 原型 v2</title>
<style>
/* ===== Design Tokens（摘自 frontend/src/styles/tokens.css，Glass Console）===== */
:root {
  --accent: #1677FF; --accent-light: #4096ff;
  --accent-gradient: linear-gradient(135deg, #1677FF 0%, #5B8FF9 100%);
  --danger: #e5484d; --success: #2f9d78;
  --amber: #d48806; --violet: #7c5cf0; --cyan: #0ea5b7; --gold: #d4a853;
  --radius-sm: 8px; --radius-md: 12px; --radius-lg: 16px; --radius-xl: 20px;
  --ease: cubic-bezier(.16, 1, .3, 1);
  --presence-online: #52C9A0; --presence-busy: #9c86ff; --presence-offline: #c9cdd4;
}
:root[data-theme="light"] {
  --bg-primary: #F2F6FC; --bg-card: #ffffff;
  --text-primary: #1d2129; --text-secondary: #4e5969; --text-muted: #86909c; --text-disabled: #c9cdd4;
  --border-primary: rgba(22, 119, 255, 0.10); --border-light: rgba(22, 119, 255, 0.16);
  --glass-bg: rgba(255, 255, 255, 0.55); --glass-bg-2: rgba(255, 255, 255, 0.72);
  --glass-border: rgba(120, 144, 176, 0.38); --glass-border-strong: rgba(22, 119, 255, 0.45);
  --glass-highlight: rgba(255, 255, 255, 1);
  --shadow-soft: rgba(22, 119, 255, 0.08); --shadow-strong: rgba(22, 119, 255, 0.14);
  --row-hover: rgba(22, 119, 255, 0.04);
  --bg-gradient:
    radial-gradient(ellipse 80% 60% at 12% 0%, rgba(22, 119, 255, 0.16), transparent 55%),
    radial-gradient(ellipse 65% 55% at 95% 15%, rgba(91, 143, 249, 0.12), transparent 60%),
    linear-gradient(180deg, #DCE9F8 0%, #E9F0FA 45%, #F2F6FC 100%);
}
:root[data-theme="dark"] {
  --bg-primary: #08090B; --bg-card: #1e1e1e;
  --text-primary: #E8ECEF; --text-secondary: #9BA1AA; --text-muted: #6E7582; --text-disabled: #3D424D;
  --border-primary: rgba(255, 255, 255, 0.10); --border-light: rgba(255, 255, 255, 0.15);
  --glass-bg: rgba(255, 255, 255, 0.06); --glass-bg-2: rgba(255, 255, 255, 0.09);
  --glass-border: rgba(255, 255, 255, 0.11); --glass-border-strong: rgba(22, 119, 255, 0.55);
  --glass-highlight: rgba(255, 255, 255, 0.18);
  --shadow-soft: rgba(0, 0, 0, 0.30); --shadow-strong: rgba(0, 0, 0, 0.50);
  --row-hover: rgba(255, 255, 255, 0.05);
  --presence-online: #52C9A0; --presence-busy: #9C86FF; --presence-offline: #3D424D;
  --bg-gradient:
    radial-gradient(ellipse 70% 50% at 18% 0%, rgba(22, 119, 255, 0.10), transparent 60%),
    radial-gradient(ellipse 60% 45% at 88% 100%, rgba(114, 46, 209, 0.08), transparent 60%),
    linear-gradient(180deg, #0A0E1A 0%, #060810 100%);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  font-size: 14px; color: var(--text-primary); background: var(--bg-gradient) fixed;
  min-height: 100vh; padding: 20px 28px 40px;
  transition: background 0.3s var(--ease), color 0.3s var(--ease);
}
body.fs-lock { overflow: hidden; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ===== 顶栏 ===== */
.proto-head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.proto-head h1 { font-size: 19px; font-weight: 700; letter-spacing: 0.5px; }
.proto-sub { color: var(--text-muted); font-size: 12px; }
.proto-tools { margin-left: auto; display: flex; gap: 8px; }
.proto-btn {
  border: 1px solid var(--glass-border); background: var(--glass-bg); color: var(--text-secondary);
  border-radius: var(--radius-sm); padding: 5px 12px; font-size: 12px; cursor: pointer;
  backdrop-filter: blur(10px); transition: all 0.2s var(--ease);
}
.proto-btn:hover { border-color: var(--accent); color: var(--accent); }

/* ===== 舞台 ===== */
.stage {
  display: flex; height: calc(100vh - 118px); min-height: 560px;
  border: 1px solid var(--glass-border); border-radius: var(--radius-xl);
  background: var(--glass-bg); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  box-shadow: 0 10px 30px var(--shadow-soft), inset 0 1px 0 var(--glass-highlight);
  overflow: hidden; position: relative;
}
.stage.fullscreen { position: fixed; inset: 0; z-index: 70; height: 100vh; border-radius: 0; }

/* ===== 左栏：会话列表 ===== */
.conv-list { width: 300px; flex-shrink: 0; border-right: 1px solid var(--border-primary); display: flex; flex-direction: column; }
.conv-filter { display: flex; gap: 4px; padding: 12px 12px 8px; }
.cf-item {
  padding: 4px 12px; border-radius: 999px; font-size: 12px; cursor: pointer; color: var(--text-secondary);
  border: 1px solid transparent; transition: all 0.15s var(--ease);
}
.cf-item:hover { color: var(--accent); }
.cf-item.active { color: var(--accent); border-color: var(--glass-border-strong); background: var(--row-hover); }
.cf-item .n { font-size: 11px; margin-left: 2px; }
.conv-scroll { flex: 1; overflow-y: auto; padding: 4px 8px 12px; }
.conv-group { font-size: 11px; color: var(--text-muted); font-weight: 600; letter-spacing: 1px; padding: 10px 8px 6px; }
.conv-item {
  display: flex; gap: 10px; padding: 9px 10px; border-radius: var(--radius-md); cursor: pointer;
  transition: background 0.15s; border: 1px solid transparent; align-items: center;
}
.conv-item:hover { background: var(--row-hover); }
.conv-item.active { background: var(--row-hover); border-color: var(--border-primary); }
.conv-main { flex: 1; min-width: 0; }
.conv-name-row { display: flex; align-items: center; gap: 6px; }
.conv-name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.conv-time { font-size: 11px; color: var(--text-disabled); flex-shrink: 0; }
.conv-preview { font-size: 12px; color: var(--text-muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.conv-preview.typing { color: var(--accent); }
.conv-preview .who { color: var(--text-secondary); }
.unread {
  flex-shrink: 0; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px;
  background: #FF6B6B; color: #fff; font-size: 11px; font-weight: 600;
  display: flex; align-items: center; justify-content: center;
}
.muted-ico { font-size: 11px; color: var(--text-disabled); }

/* 头像 + presence */
.avwrap { position: relative; flex-shrink: 0; }
.avatar {
  border-radius: 50%; display: flex; align-items: center; justify-content: center;
  font-weight: 600; color: #fff; flex-shrink: 0; user-select: none;
}
.avwrap.clickable { cursor: pointer; }
.presence {
  position: absolute; right: -1px; bottom: -1px; width: 9px; height: 9px; border-radius: 50%;
  border: 2px solid var(--bg-card);
}
.presence.online { background: var(--presence-online); }
.presence.busy { background: var(--presence-busy); }
.presence.offline { background: var(--presence-offline); }

/* ===== 右栏：聊天面 ===== */
.chat { flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative; }
.chat-head {
  display: flex; align-items: center; gap: 12px; padding: 12px 18px;
  border-bottom: 1px solid var(--border-primary);
}
.chat-title { font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.chat-topic { font-size: 12px; color: var(--text-muted); margin-top: 1px; }
.kind-chip {
  font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px;
  color: var(--accent); background: rgba(22, 119, 255, 0.10); border: 1px solid rgba(22, 119, 255, 0.18);
}
.kind-chip.dm { color: var(--violet); background: rgba(124, 92, 240, 0.10); border-color: rgba(124, 92, 240, 0.20); }
.thread-chip {
  font-size: 11px; padding: 2px 8px; border-radius: 999px; color: var(--amber);
  background: color-mix(in srgb, var(--amber) 12%, transparent); cursor: pointer;
}
.head-spacer { flex: 1; }
.roster { display: flex; align-items: center; }
.roster .avwrap { margin-left: -6px; border-radius: 50%; }
.roster .avwrap:first-child { margin-left: 0; }
.roster-more { font-size: 11px; color: var(--text-muted); margin-left: 8px; }
.head-tool {
  width: 30px; height: 30px; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center;
  color: var(--text-muted); cursor: pointer; font-size: 14px; border: 1px solid transparent; transition: all 0.15s;
}
.head-tool:hover { color: var(--accent); background: var(--row-hover); border-color: var(--border-primary); }
.status-pill {
  font-size: 12px; padding: 3px 10px; border-radius: 999px;
  border: 1px solid var(--sc, var(--glass-border)); color: var(--sc, var(--text-secondary));
  background: color-mix(in srgb, var(--sc, transparent) 10%, transparent);
}

/* 时间线 */
.timeline { flex: 1; overflow-y: auto; padding: 18px 22px 10px; scroll-behavior: smooth; }
.day-divider { display: flex; align-items: center; gap: 12px; margin: 4px 0 14px; color: var(--text-muted); font-size: 11px; }
.day-divider::before, .day-divider::after { content: ''; flex: 1; height: 1px; background: var(--border-primary); }
.sysline { text-align: center; font-size: 12px; color: var(--text-muted); margin: 8px 0; }
.sysline .hl { color: var(--text-secondary); font-weight: 600; }

/* 小声聊摘要行（同事私聊可见） */
.whisper-row {
  display: flex; align-items: center; justify-content: center; gap: 8px; margin: 10px 0;
  font-size: 12px; color: var(--text-muted); cursor: pointer;
}
.whisper-row:hover { color: var(--violet); }
.whisper-row .wk {
  padding: 3px 12px; border-radius: 999px; border: 1px dashed var(--glass-border);
  background: color-mix(in srgb, var(--violet) 5%, transparent);
}
.whisper-row .peek { font-weight: 600; }

.msg { display: flex; gap: 10px; margin-bottom: 16px; position: relative; }
.msg.mine { flex-direction: row-reverse; }
.msg-body { max-width: 72%; min-width: 0; }
.msg-meta { display: flex; align-items: baseline; gap: 8px; margin-bottom: 5px; }
.msg.mine .msg-meta { justify-content: flex-end; }
.msg-name { font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.role-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--c, var(--accent)); flex-shrink: 0; }
.role-tag {
  font-size: 10.5px; font-weight: 600; color: var(--c, var(--text-muted));
  background: color-mix(in srgb, var(--c, transparent) 12%, transparent);
  padding: 1px 7px; border-radius: 999px; cursor: pointer;
}
.human-tag {
  font-size: 10px; font-weight: 700; letter-spacing: 1px; color: var(--gold);
  border: 1px solid color-mix(in srgb, var(--gold) 40%, transparent);
  padding: 0 6px; border-radius: 999px;
}
.live-pill {
  font-size: 10.5px; color: var(--accent); display: inline-flex; align-items: center; gap: 4px;
}
.live-pill i {
  width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: pulse 1.1s infinite;
}
@keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.35; transform: scale(0.8); } }
.msg-time { font-size: 11px; color: var(--text-disabled); }
.bubble {
  padding: 10px 14px; border-radius: 4px var(--radius-lg) var(--radius-lg) var(--radius-lg);
  background: var(--glass-bg-2); border: 1px solid var(--border-light);
  line-height: 1.7; font-size: 13.5px; word-break: break-word;
  box-shadow: 0 2px 8px var(--shadow-soft), inset 0 1px 0 var(--glass-highlight);
}
.msg.mine .bubble {
  border-radius: var(--radius-lg) 4px var(--radius-lg) var(--radius-lg);
  background: color-mix(in srgb, var(--accent) 9%, var(--bg-card));
  border-color: color-mix(in srgb, var(--accent) 22%, transparent);
}
.bubble.sched {
  background: color-mix(in srgb, #d48806 7%, var(--bg-card));
  border-color: color-mix(in srgb, #d48806 25%, transparent);
}
.sched-tag {
  display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600;
  color: var(--amber); background: color-mix(in srgb, var(--amber) 13%, transparent);
  padding: 1px 8px; border-radius: 999px; margin-right: 6px; vertical-align: 1px;
}
.mention {
  display: inline-flex; align-items: center; gap: 3px; padding: 0 6px; border-radius: 6px;
  font-weight: 600; color: var(--mc, var(--accent));
  background: color-mix(in srgb, var(--mc, var(--accent)) 13%, transparent);
  cursor: pointer; white-space: nowrap;
}
.mention.me { color: var(--accent); background: rgba(22, 119, 255, 0.13); cursor: default; }

/* 思考块（可折叠思考摘要） */
.think-block { margin: 2px 0 8px; border: 1px solid var(--border-primary); border-radius: var(--radius-sm); overflow: hidden; background: var(--row-hover); }
.think-head {
  display: flex; align-items: center; gap: 7px; padding: 6px 10px; cursor: pointer;
  font-size: 12px; color: var(--text-muted); user-select: none;
}
.think-head:hover { color: var(--text-secondary); }
.think-head .chev { margin-left: auto; font-size: 10px; transition: transform 0.2s var(--ease); }
.think-head.open .chev { transform: rotate(180deg); }
.think-head .sec { color: var(--text-disabled); }
.think-head.thinking { color: var(--accent); }
.think-body { padding: 2px 12px 9px; font-size: 12.5px; line-height: 1.75; color: var(--text-muted); }
.caret { display: inline-block; width: 7px; height: 14px; background: var(--accent); vertical-align: -2px; margin-left: 2px; animation: blink 0.9s steps(1) infinite; border-radius: 1px; }
@keyframes blink { 50% { opacity: 0; } }

/* 工具活动卡片（思考过程可见化，cumora ToolCard 式） */
.tool-card {
  display: flex; align-items: center; gap: 9px; padding: 7px 10px; margin: 6px 0;
  border: 1px solid var(--border-light); border-radius: var(--radius-sm); background: var(--row-hover);
}
.tool-card .tico {
  width: 26px; height: 26px; border-radius: 7px; flex-shrink: 0; font-size: 13px;
  display: flex; align-items: center; justify-content: center;
  background: color-mix(in srgb, var(--c, var(--accent)) 13%, transparent); color: var(--c, var(--accent));
}
.tool-card .tnm { font-size: 12.5px; font-weight: 600; }
.tool-card .tnm .arg { color: var(--text-muted); font-weight: 400; }
.tool-card .tdt { font-size: 11.5px; color: var(--text-muted); margin-top: 1px; }
.tool-card .tst { margin-left: auto; flex-shrink: 0; font-size: 11px; }
.tool-card .tst.run { color: var(--accent); display: inline-flex; align-items: center; gap: 5px; }
.tool-card .tst.run i {
  width: 10px; height: 10px; border: 2px solid rgba(22, 119, 255, 0.25); border-top-color: var(--accent);
  border-radius: 50%; animation: spin 0.8s linear infinite; display: inline-block;
}
@keyframes spin { to { transform: rotate(360deg); } }
.tool-card .tst.done { color: var(--success); }

/* 时间线内嵌卡片 */
.inline-card {
  margin-top: 8px; padding: 10px 12px; border-radius: var(--radius-md);
  border: 1px solid var(--border-light); background: var(--row-hover);
  display: flex; align-items: center; gap: 10px; cursor: pointer; transition: all 0.15s var(--ease);
}
.inline-card:hover { border-color: var(--glass-border-strong); }
.inline-card .ico {
  width: 34px; height: 34px; border-radius: var(--radius-sm); flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; font-size: 16px;
  background: color-mix(in srgb, var(--c, var(--accent)) 13%, transparent); color: var(--c, var(--accent));
}
.inline-card .t { font-size: 13px; font-weight: 600; }
.inline-card .s { font-size: 12px; color: var(--text-muted); margin-top: 1px; }
.inline-card .go { margin-left: auto; font-size: 12px; color: var(--accent); font-weight: 600; flex-shrink: 0; }
.state-chip {
  font-size: 11px; padding: 1px 8px; border-radius: 999px; font-weight: 600;
  color: var(--success); background: color-mix(in srgb, var(--success) 13%, transparent); margin-left: 6px;
}

/* 引用回复 */
.quote-card {
  display: flex; gap: 8px; padding: 6px 10px; margin-bottom: 6px; border-left: 2px solid var(--glass-border);
  background: var(--row-hover); border-radius: 6px; cursor: pointer; font-size: 12px;
}
.quote-card:hover { border-left-color: var(--accent); }
.quote-card .qn { font-weight: 600; color: var(--text-secondary); }
.quote-card .qt { color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hover-tools {
  position: absolute; top: -4px; right: 0; display: flex; gap: 2px; opacity: 0; transition: opacity 0.15s; z-index: 2;
}
.msg:hover .hover-tools { opacity: 1; }
.ht-btn {
  width: 24px; height: 24px; border-radius: 6px; font-size: 12px; cursor: pointer;
  display: flex; align-items: center; justify-content: center; color: var(--text-muted);
  border: 1px solid var(--border-light); background: var(--bg-card);
}
.ht-btn:hover { color: var(--accent); border-color: var(--accent); }

/* typing 指示 */
.typing-row { display: flex; align-items: center; gap: 10px; margin: -6px 0 14px; font-size: 12px; color: var(--text-muted); height: 22px; }
.dots { display: inline-flex; gap: 3px; }
.dots i {
  width: 5px; height: 5px; border-radius: 50%; background: var(--accent); opacity: 0.4;
  animation: bounce 1.2s infinite;
}
.dots i:nth-child(2) { animation-delay: 0.15s; }
.dots i:nth-child(3) { animation-delay: 0.3s; }
@keyframes bounce { 0%, 60%, 100% { transform: translateY(0); opacity: 0.4; } 30% { transform: translateY(-4px); opacity: 1; } }

/* 空态（新会话） */
.empty-state { text-align: center; padding: 60px 20px 20px; color: var(--text-muted); }
.empty-state .big { font-size: 34px; margin-bottom: 10px; }
.empty-state .tip { font-size: 13px; margin-bottom: 16px; }
.sugg-row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.sugg {
  padding: 7px 14px; border-radius: 999px; border: 1px solid var(--border-light);
  background: var(--glass-bg-2); font-size: 12.5px; cursor: pointer; color: var(--text-secondary);
  transition: all 0.15s var(--ease);
}
.sugg:hover { color: var(--accent); border-color: var(--glass-border-strong); }

/* 输入区 */
.composer-wrap { padding: 10px 18px 14px; position: relative; }
.composer-quote {
  display: flex; align-items: center; gap: 8px; padding: 6px 10px; margin-bottom: 6px;
  border-left: 2px solid var(--accent); background: var(--row-hover); border-radius: 6px; font-size: 12px;
}
.composer-quote .x { margin-left: auto; cursor: pointer; color: var(--text-muted); }
.composer-quote .x:hover { color: var(--danger); }
.composer {
  border: 1px solid var(--border-light); border-radius: var(--radius-lg);
  background: var(--bg-card); transition: border-color 0.15s; padding: 10px 12px 8px;
}
.composer:focus-within { border-color: var(--glass-border-strong); box-shadow: 0 0 0 3px rgba(22, 119, 255, 0.08); }
.composer-input { min-height: 40px; max-height: 120px; overflow-y: auto; outline: none; font-size: 13.5px; line-height: 1.7; }
.composer-input:empty::before { content: attr(data-placeholder); color: var(--text-disabled); }
.composer-input .mention { margin: 0 1px; }
.composer-tools { display: flex; align-items: center; gap: 4px; margin-top: 4px; }
.tool-ico {
  width: 28px; height: 28px; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center;
  color: var(--text-muted); cursor: pointer; font-size: 14px; transition: all 0.15s;
}
.tool-ico:hover { color: var(--accent); background: var(--row-hover); }
.composer-hint { margin-left: auto; font-size: 11px; color: var(--text-disabled); }
.composer-hint b { color: var(--text-muted); font-weight: 600; }
.btn-send {
  border: none; cursor: pointer; background: var(--accent-gradient); color: #fff;
  border-radius: 999px; padding: 6px 18px; font-size: 12.5px; font-weight: 600; margin-left: 8px;
  box-shadow: 0 3px 10px rgba(22, 119, 255, 0.30); transition: all 0.2s var(--ease);
}
.btn-send:hover { transform: translateY(-1px); }

/* @ 召唤 picker */
.at-picker {
  position: absolute; left: 18px; bottom: calc(100% - 4px); width: 280px; z-index: 30;
  border: 1px solid var(--glass-border); border-radius: var(--radius-md); overflow: hidden;
  background: var(--glass-bg-2); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  box-shadow: 0 14px 40px var(--shadow-strong), inset 0 1px 0 var(--glass-highlight);
  display: none;
}
.at-picker.open { display: block; }
.at-title { font-size: 11px; color: var(--text-muted); padding: 8px 12px 4px; }
.at-item { display: flex; align-items: center; gap: 10px; padding: 7px 12px; cursor: pointer; }
.at-item:hover, .at-item.hover { background: var(--row-hover); }
.at-item .nm { font-size: 13px; font-weight: 600; }
.at-item .rl { font-size: 11px; color: var(--text-muted); }
.at-item .summon { margin-left: auto; font-size: 11px; color: var(--accent); }

/* AI 角色名片 */
.persona-pop {
  position: fixed; z-index: 80; width: 300px;
  border: 1px solid var(--glass-border); border-radius: var(--radius-lg);
  background: var(--glass-bg-2); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);

/* toast */
.toast {
  position: fixed; left: 50%; bottom: 34px; transform: translateX(-50%) translateY(20px);

.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast b { color: var(--accent); }

/* modal */

::-webkit-scrollbar { width: 8px; height: 8px; }

function avatarEl(pid, size = 32, fontSize, clickable) {
  const p = PEOPLE[pid]
  const w = document.createElement('div')

  w.innerHTML = `<div class="avatar" style="width:${size}px;height:${size}px;background:${p.color};font-size:${fontSize || Math.round(size * 0.4)}px">${esc(p.name[0])}</div>

  return w
}
function mentionHtml(text, clickable) {
  let html = esc(text)
  for (const pid of Object.keys(PEOPLE)) {
    const p = PEOPLE[pid]
    const tag = pid === 'me' ? '@我' : '@' + p.name
    html = html.split(tag).join(

function renderConvList() {

  for (const [label, list] of groups) {
    const shown = list.filter((c) =>
      filterMode === 'all' || (filterMode === 'unread' ? c.unread > 0 : c.kind === filterMode))
    if (!shown.length) continue
    const g = document.createElement('div')
    g.className = 'conv-group'
    g.textContent = label
    box.appendChild(g)
    for (const c of shown) {
      totalUnread += c.unread
      const row = document.createElement('div')
      row.className = 'conv-item' + (c.id === currentId ? ' active' : '')
      const typingHtml = c.typing

  }

/* ===== 思考流（发送后的模拟回话：思考 → 工具 → 流式回答） ===== */
function streamInto(m, field, full, cps, done) {
  let i = 0
  const iv = setInterval(() => {
    i = Math.min(full.length, i + cps)
    m[field] = full.slice(0, i)
    if (currentId === m.__convId && !viewing) renderTimeline()
    if (i >= full.length) { clearInterval(iv); done && done() }
  }, 30)
}
function fakeReply(c, userText) {
  const mentioned = AI_IDS.filter((pid) => (userText || '').includes('@' + PEOPLE[pid].name))
  const replier = c.kind === 'dm' ? c.peer
    : (mentioned[0] || c.members.find((pid) => pid !== 'me' && pid !== 'assistant') || 'assistant')
  const name = PEOPLE[replier].name
  setTimeout(() => setTyping(c.id, name, true), 500)
  setTimeout(() => {
    setTyping(c.id, name, false)
    const m = { from: replier, type: 'think', think: '', thinkDone: false, text: '', tools: [], live: true,
      thinkStart: Date.now(), __convId: c.id, time: nowTime() }
    c.msgs.push(m)
    if (currentId === c.id && !viewing) renderTimeline()
    streamInto(m, 'think', THINK_POOL[Math.floor(Math.random() * THINK_POOL.length)], 3, () => {
      // 工具活动卡片：跑一张 → 完成 →（回答前思考自动收起）
      const tool = { ...TOOL_POOL[Math.floor(Math.random() * TOOL_POOL.length)], arg: toolArg(c, userText), status: 'run' }
      m.tools.push(tool)
      if (currentId === c.id && !viewing) renderTimeline()
      setTimeout(() => {
        tool.status = 'done'
        m.thinkDone = true
        m.thinkSec = ((Date.now() - m.thinkStart) / 1000).toFixed(1)
        if (currentId === c.id && !viewing) renderTimeline()
        setTimeout(() => {
          m.answerStreaming = true
          streamInto(m, 'text', cannedAnswer(c, replier, userText), 3, () => {
            m.answerStreaming = false
            m.live = false
            c.preview = m.text
            c.time = '刚'
            renderConvList()
            if (currentId === c.id && !viewing) renderTimeline()
          })
        }, 400)
      }, 1300)
    })
  }, 1600)
}
function toolArg(c, userText) {
  const t = (userText || '').replace(/@\S+/g, '').trim()
  return t.length > 12 ? t.slice(0, 12) + '…' : (t || '当前上下文')
}
function cannedAnswer(c, pid, userText) {
  if (c.kind === 'dm') {
    return { lin: '查了库内事实：X710-DA2 现货够，走这条最稳；国产案我继续压交期，有变化我在房间同步。',
      zhou: '按最新口径重核了：毛利 18.4%，红线之上，放心。低于 15% 我会直接标红。',
      wei: '运营价清单到了以后我逐行替换占位价，总价和利润率今晚前更新到报价单。',
      lan: '后台爬虫在跑，国产卡有低于 5% 价差的标的我会直接贴进来。',
      assistant: '收到，我记进今日待办，节点有变化我在房间同步。' }[pid] || '收到，我先按这个推进。'
  }
  return '收到，这块我认领了，推进有结果直接同步进房间。'
}

/* ===== @ 召唤 picker ===== */
const composer = $('#composerInput')
const picker = $('#atPicker')
let atFilter = ''
let atHoverIdx = 0
let atCandidates = []
composer.addEventListener('input', () => {
  const text = composer.textContent
  const m = /@([^@\s]*)$/.exec(text)
  if (m) {
    atFilter = m[1]
    atCandidates = AI_IDS.filter((pid) => PEOPLE[pid].name.includes(atFilter))
    if (atCandidates.length) {
      atHoverIdx = 0
      renderPicker()
      picker.classList.add('open')
      return
    }
  }
  picker.classList.remove('open')
})
function renderPicker() {
  picker.innerHTML = '<div class="at-title">召唤同事（@ = 指定 TA 接话）</div>' + atCandidates.map((pid, i) => {
    const p = PEOPLE[pid]
    return `<div class="at-item ${i === atHoverIdx ? 'hover' : ''}" data-pid="${pid}">
      <span data-av></span>
      <div><div class="nm">${esc(p.name)}</div><div class="rl">${esc(p.role)}</div></div>
      <span class="summon">召唤 ›</span>
    </div>`
  }).join('')
  picker.querySelectorAll('.at-item').forEach((el, i) => {
    el.querySelector('[data-av]').replaceWith(avatarEl(el.dataset.pid, 26, 11))
    el.onclick = () => insertMention(el.dataset.pid)
    el.onmouseenter = () => { atHoverIdx = i }
  })
}
function insertMention(pid) {
  const p = PEOPLE[pid]
  for (let i = composer.childNodes.length - 1; i >= 0; i--) {
    const n = composer.childNodes[i]
    if (n.nodeType === 3 && n.nodeValue.endsWith('@' + atFilter)) {
      n.nodeValue = n.nodeValue.slice(0, -(atFilter.length + 1))
      const chip = document.createElement('span')
      chip.className = 'mention'
      chip.style.setProperty('--mc', p.color)
      chip.contentEditable = 'false'
      chip.textContent = '◎ ' + p.name
      composer.insertBefore(chip, n.nextSibling)
      composer.insertBefore(document.createTextNode(' '), chip.nextSibling)
      break
    }
  }
  picker.classList.remove('open')
  composer.focus()
  placeCaretEnd(composer)
}
function placeCaretEnd(el) {
  const r = document.createRange()
  r.selectNodeContents(el)
  r.collapse(false)
  const s = getSelection()
  s.removeAllRanges()
  s.addRange(r)
}
composer.addEventListener('keydown', (e) => {
  if (picker.classList.contains('open')) {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault()
      atHoverIdx = (atHoverIdx + (e.key === 'ArrowDown' ? 1 : atCandidates.length - 1)) % atCandidates.length
      renderPicker()
      return
    }
    if (e.key === 'Enter' || e.key === 'Tab') {
      e.preventDefault()
      insertMention(atCandidates[atHoverIdx][0])
      return
    }
    if (e.key === 'Escape') { picker.classList.remove('open'); return }
  }
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendCurrent() }
})

function setQuote(m) {
  if (!m.from || m.type === 'think' && false) return
  const text = m.text || m.think || ''
  if (!text) return
  quoted = { name: PEOPLE[m.from].name, text: text.replace(/\n/g, ' ').slice(0, 60) + (text.length > 60 ? '…' : '') }
  renderQuoteSlot()
  composer.focus()
}
function renderQuoteSlot() {
  const slot = $('#quoteSlot')
  if (!quoted) { slot.innerHTML = ''; return }
  slot.innerHTML = `<div class="composer-quote">↩ 引用 <b>${esc(quoted.name)}</b>：${esc(quoted.text)}<span class="x">✕</span></div>`
  slot.querySelector('.x').onclick = () => { quoted = null; renderQuoteSlot() }
}

/* ===== 发送 ===== */
function plainText(el) {
  let out = ''
  el.childNodes.forEach((n) => {
    if (n.nodeType === 3) out += n.nodeValue
    else if (n.classList && n.classList.contains('mention')) out += '@' + n.textContent.replace('◎ ', '')
    else if (n.tagName === 'BR') out += '\n'
  })
  return out.trim()
}
function nowTime() {
  const d = new Date()
  return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`
}
function sendCurrent() {
  const c = CONVS.find((x) => x.id === currentId)
  if (viewing) exitArchive()
  const text = plainText(composer)
  if (!text) return
  composer.innerHTML = ''
  picker.classList.remove('open')
  const msg = { from: 'me', type: 'text', text, time: nowTime() }
  if (quoted) { msg.quote = quoted; quoted = null; renderQuoteSlot() }
  c.msgs.push(msg)
  c.preview = text
  c.time = '刚'
  renderConvList(); renderTimeline()
  fakeReply(c, text)
}

    setTyping(a.conv, a.who, true)
    setTimeout(() => {

      if (currentId === a.conv) { renderTimeline(); renderConvList() }

    }, 2600)
  }, a.at)
}
